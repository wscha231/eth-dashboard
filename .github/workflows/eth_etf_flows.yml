name: ETH ETF flow research

on:
  push:
    branches: [main]
    paths:
      - data_lab/eth_etf_flows.py
      - scripts/collect_eth_etf_flows.py
      - scripts/etf_drive_state.py
      - tests/test_eth_etf_flows.py
      - config/eth_etf_flow_contract.json
      - .github/workflows/eth_etf_flows.yml
  pull_request:
    branches: [main]
    paths:
      - data_lab/eth_etf_flows.py
      - scripts/collect_eth_etf_flows.py
      - scripts/etf_drive_state.py
      - tests/test_eth_etf_flows.py
      - config/eth_etf_flow_contract.json
      - .github/workflows/eth_etf_flows.yml
  schedule:
    - cron: "35 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eth-etf-flow-research-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - run: python -m pip install -r requirements-runtime.txt pytest

      - name: Validate parser, revision and PIT contracts
        run: |
          python -m pytest tests/test_eth_etf_flows.py -q
          git diff --check

      - name: Restore prior private ETF revision state from Drive
        if: github.event_name != 'pull_request'
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/etf_drive_state.py restore --target lake/etf-previous --optional

      - name: Collect live Ethereum ETF table with immutable raw receipt
        run: |
          rm -rf lake/etf-research
          if [ -d lake/etf-previous ]; then
            python scripts/collect_eth_etf_flows.py --output-dir lake/etf-research --previous-dir lake/etf-previous
          else
            python scripts/collect_eth_etf_flows.py --output-dir lake/etf-research
          fi
          test -s lake/etf-research/eth_etf_flow_revisions.csv.gz
          test -s lake/etf-research/eth_etf_flows_daily.csv
          test -s lake/etf-research/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('lake/etf-research/report.json').read_text())
          assert r['model_use_approved'] is False
          assert r['public_redistribution_approved'] is False
          assert r['rights_status']=='unreviewed_no_public_redistribution'
          assert r['rows'] >= 3
          print(json.dumps(r, sort_keys=True))
          PY
          cat lake/etf-research/report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Commit private ETF state to durable Drive stream
        if: github.event_name != 'pull_request'
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/etf_drive_state.py backup --root lake/etf-research
          rm -rf lake/etf-readback
          python scripts/etf_drive_state.py restore --target lake/etf-readback
          sha256sum lake/etf-research/report.json lake/etf-readback/report.json
          test "$(sha256sum lake/etf-research/report.json | cut -d' ' -f1)" = "$(sha256sum lake/etf-readback/report.json | cut -d' ' -f1)"
          test "$(sha256sum lake/etf-research/eth_etf_flow_revisions.csv.gz | cut -d' ' -f1)" = "$(sha256sum lake/etf-readback/eth_etf_flow_revisions.csv.gz | cut -d' ' -f1)"

      - name: Publish metadata-only QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-etf-flow-report
          path: lake/etf-research/report.json
          retention-days: 30
          if-no-files-found: warn

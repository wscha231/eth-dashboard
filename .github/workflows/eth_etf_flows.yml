name: ETH ETF flow research
on:
  pull_request:
    branches: [main]
    paths:
      - data_lab/etf_flows.py
      - scripts/collect_etf_flows.py
      - tests/test_etf_flows.py
      - research/r3_etf_flows_v1_20260917/**
      - .github/workflows/eth_etf_flows.yml
  push:
    branches: [main]
    paths:
      - data_lab/etf_flows.py
      - scripts/collect_etf_flows.py
      - tests/test_etf_flows.py
      - research/r3_etf_flows_v1_20260917/**
      - .github/workflows/eth_etf_flows.yml
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: eth-etf-flow-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install -r requirements-runtime.txt pytest
      - name: Test ETF parser, PIT rules and revision journal
        run: python -m pytest tests/test_etf_flows.py -q
      - name: Find previous successful ETF research state
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name:'eth-etf-flow-state',per_page:100});
            const allowed=['main',context.payload.pull_request?.head?.ref].filter(Boolean);
            if(context.eventName==='push') {
              const {data:prs}=await github.rest.repos.listPullRequestsAssociatedWithCommit({...context.repo,commit_sha:context.sha});
              for(const pr of prs) if(pr.merged_at && pr.merge_commit_sha===context.sha && pr.head.repo?.full_name===`${context.repo.owner}/${context.repo.repo}`) allowed.push(pr.head.ref);
            }
            const artifact=data.artifacts.find(a=>!a.expired && a.workflow_run?.head_repository_id===context.payload.repository.id && allowed.includes(a.workflow_run?.head_branch));
            if(artifact) core.setOutput('run',artifact.workflow_run.id);
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run }}
          name: eth-etf-flow-state
          path: lake/research/eth_etf_flows
      - name: Collect current Farside ETH ETF flow receipt
        run: python scripts/collect_etf_flows.py --root lake/research/eth_etf_flows
      - name: Verify research-only gate and coverage
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('lake/research/eth_etf_flows/report.json')
          d=json.loads(p.read_text())
          assert d['status']=='research_only_rights_unreviewed'
          assert d['public_redistribution']=='blocked_pending_rights_review'
          assert d['model_use'].startswith('blocked_')
          assert d['rows'] >= 100
          assert d['non_null_total_rows'] >= 100
          assert len(d['raw_sha256']) == 64
          print(json.dumps({k:d[k] for k in ('rows','first_date','last_date','new_rows','revised_rows','unchanged_rows','raw_sha256')},sort_keys=True))
          PY
      - name: Upload immutable research state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-etf-flow-state
          path: lake/research/eth_etf_flows/
          compression-level: 9
          retention-days: 30
          if-no-files-found: error
      - name: Summarize source gate
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('lake/research/eth_etf_flows/report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## R3 P0-1 ETH ETF flow research\n\n')
              if not p.exists():
                  f.write('No valid source report was produced. No model/site promotion is allowed.\n')
              else:
                  d=json.loads(p.read_text())
                  for key in ('status','rows','first_date','last_date','new_rows','revised_rows','license_status','historical_available_at_policy'):
                      f.write(f'- {key}: `{d.get(key)}`\n')
                  f.write('\nModel/site use remains blocked.\n')
          PY

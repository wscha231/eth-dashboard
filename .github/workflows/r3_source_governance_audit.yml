name: R3 source PIT and rights audit

on:
  push:
    branches: [main]
    paths:
      - config/r3_research_source_registry.json
      - scripts/audit_r3_research_sources.py
      - tests/test_r3_research_source_audit.py
      - research/r3_etf_flows_v1_20260917/source_contract.md
      - research/r3_eth_supply_v1_20260917/source_contract.md
      - research/r3_eth_staking_v1_20260917/source_contract.md
      - research/r3_eth_liquidation_v1_20260917/source_contract.md
      - .github/workflows/r3_source_governance_audit.yml
  pull_request:
    branches: [main]
    paths:
      - config/r3_research_source_registry.json
      - scripts/audit_r3_research_sources.py
      - tests/test_r3_research_source_audit.py
      - research/r3_etf_flows_v1_20260917/source_contract.md
      - research/r3_eth_supply_v1_20260917/source_contract.md
      - research/r3_eth_staking_v1_20260917/source_contract.md
      - research/r3_eth_liquidation_v1_20260917/source_contract.md
      - .github/workflows/r3_source_governance_audit.yml
  schedule:
    - cron: "11 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Fail closed on PIT, rights or use-boundary drift
        run: |
          python scripts/audit_r3_research_sources.py --output r3-source-audit/report.json
          python -m pytest tests/test_r3_research_source_audit.py -q
          git diff --check
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-source-governance-audit
          path: r3-source-audit/
          retention-days: 90
          if-no-files-found: warn

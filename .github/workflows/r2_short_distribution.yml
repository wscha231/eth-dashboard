name: R2 short distribution gate
on:
  pull_request:
    branches: [main]
    paths:
      - "research/events/r2_distribution_gate.py"
      - "tests/test_r2_distribution_gate.py"
      - ".github/workflows/r2_short_distribution.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: r2-short-distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-events.txt
      - run: python -m pip install -r requirements-events.txt pytest
      - run: python -m pytest tests/test_r2_distribution_gate.py -q
      - name: Find latest successful main event research state
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name:'event-research-state',per_page:100});
            const artifact=data.artifacts.find(a=>!a.expired && a.workflow_run?.head_repository_id===context.payload.repository.id && a.workflow_run?.head_branch==='main');
            if(!artifact) core.setFailed('no durable main event-research-state artifact available');
            else core.setOutput('run',artifact.workflow_run.id);
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
          name: event-research-state
          path: lake/signals
      - name: Run frozen R2 distribution gate
        run: python research/events/r2_distribution_gate.py --root lake/signals --output r2_short_distribution.json
      - uses: actions/upload-artifact@v4
        with:
          name: r2-short-distribution
          path: r2_short_distribution.json
          retention-days: 30
      - name: Summarize gate
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('r2_short_distribution.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('R2 short distribution gate (retrospective research only)\n\n')
              for h,v in d['horizons'].items():
                  c=v['overall']['candidate']
                  f.write(f"- {h}h: {v['status']}; WIS={c['wis80']:.6f}; coverage={c['coverage80']:.2%}; width={c['mean_width']:.6f}; skill_vs_persistence={v['candidate_wis_skill_vs']['persistence_gaussian']:.2%}; skill_vs_incumbent={v['candidate_wis_skill_vs']['incumbent_selected']:.2%}\n")
          PY

name: Daily archived hybrid settlement
on:
  workflow_run:
    workflows: ["Daily ETH source refresh"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-forecast
  cancel-in-progress: false
jobs:
  forecast:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HYBRID_PUBLISH_COMPLETE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore current sources and the new active model family
        id: state
        run: |
          if ! git ls-remote --exit-code --heads origin data/hybrid-forecast > /dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin data/hybrid-forecast:refs/remotes/origin/data/hybrid-forecast data/daily-forecast:refs/remotes/origin/data/daily-forecast data/forward-research:refs/remotes/origin/data/forward-research
          mkdir -p lake/gold lake/forward lake/hybrid
          git archive origin/data/hybrid-forecast lake/hybrid | tar -x
          if [ ! -s lake/hybrid/hybrid_forecast.json ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show origin/data/daily-forecast:lake/gold/eth_master_daily.csv > lake/gold/eth_master_daily.csv
          git show origin/data/forward-research:lake/forward/flow_daily.csv > lake/forward/flow_daily.csv
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.state.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-hybrid.txt
      - run: python -m pip install -r requirements-hybrid.txt
        if: steps.state.outputs.ready == 'true'
      - name: Settle only previously issued hybrid predictions
        if: steps.state.outputs.ready == 'true'
        run: python scripts/settle_retired_hybrid.py
      - name: Publish archived outcomes without a new old-model forecast
        if: steps.state.outputs.ready == 'true'
        run: bash scripts/publish_hybrid.sh

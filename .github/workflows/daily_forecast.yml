# Daily ETH forecast pipeline.
#
# Runs every morning UTC: refreshes the master dataset, runs the full forecast
# suite, persists the headline summary + hybrid scenarios into SQLite, and
# backfills any previously unresolved forecasts.
#
# Designed for commit-back-to-repo deployment: the DB file is updated in-place
# and pushed on a dedicated branch. A companion website (Next.js / static) can
# clone the branch or mirror the DB on deploy.
name: Daily ETH forecast

on:
  schedule:
    # 00:10 UTC = 09:10 KST. 10-minute offset keeps us clear of the hourly
    # top-of-hour traffic spike on free data APIs (FRED, Yahoo).
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      fast_mode:
        description: "Run eth_price_forecast in fast-mode (degraded accuracy, shorter runtime)"
        type: boolean
        default: false
      model_phase:
        description: "Model phase label written into forecast_runs"
        type: string
        default: "phase6_production"

concurrency:
  group: daily-forecast
  cancel-in-progress: false  # don't abort a mid-flight run if manually triggered again

permissions:
  contents: write  # required to push the updated DB back to the repo

jobs:
  model-eval:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.model_phase == 'eval_oof_smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: "1"
      ETH_ENABLE_CHALLENGER_MODELS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pandas scikit-learn scipy catboost \
                        lightgbm xgboost yfinance requests beautifulsoup4 \
                        python-dateutil pytest
          fi
          pip install pytest

      - name: Static leakage and feature tests
        run: |
          pytest tests/phase0/test_feature_sanity.py tests/phase0/test_leakage_audit.py tests/test_model_registry.py -q

      - name: Long-run OOF smoke
        run: |
          python tests/phase0/longrun_oof_phase6_production.py \
            --master-data-csv lake/gold/eth_master_daily.csv \
            --fold-start 33 \
            --max-folds 3

      - name: Candidate evaluation gate
        run: |
          python scripts/evaluate_eth_candidate.py \
            --baseline tests/phase0/model_baseline_manifest.json \
            --candidate tests/phase0/phase6_production_longrun_oof_metrics.json \
            --profile smoke
          cat tests/phase0/model_eval_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model evaluation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-model-eval-${{ github.run_id }}
          path: |
            tests/phase0/model_eval_report.json
            tests/phase0/model_eval_report.md
            tests/phase0/phase6_production_longrun_oof_metrics.json
          retention-days: 21

  forecast:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.model_phase != 'eval_oof_smoke' }}
    # Free-tier runner has 7GB RAM + 2 cores.
    # Phase 5 full run (CatBoost + MLP + 3-fold CV) takes ~50-70 min on 2 cores.
    # Allow time for the 65-85 minute model run plus post-deploy freshness polling.
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # Secrets — configure under Settings > Secrets and variables > Actions.
      FRED_API_KEY:         ${{ secrets.FRED_API_KEY }}
      GLASSNODE_API_KEY:    ${{ secrets.GLASSNODE_API_KEY }}
      DERIBIT_CLIENT_ID:    ${{ secrets.DERIBIT_CLIENT_ID }}
      DERIBIT_CLIENT_SECRET: ${{ secrets.DERIBIT_CLIENT_SECRET }}
      # Optional: Telegram alert. If unset, the notify step no-ops.
      TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
      # Donation tracker — Etherscan key is required for ERC-20 scanning;
      # the 4 wallet addresses are public but kept as secrets so the workflow
      # file stays clean and the addresses can be rotated without a code push.
      ETHERSCAN_API_KEY:        ${{ secrets.ETHERSCAN_API_KEY }}
      DONATION_BTC_ADDRESS:     ${{ secrets.DONATION_BTC_ADDRESS }}
      DONATION_ETH_ADDRESS:     ${{ secrets.DONATION_ETH_ADDRESS }}
      DONATION_SOL_ADDRESS:     ${{ secrets.DONATION_SOL_ADDRESS }}
      DONATION_TRX_ADDRESS:     ${{ secrets.DONATION_TRX_ADDRESS }}
      # Non-secret tuning knobs.
      MODEL_PHASE:   ${{ inputs.model_phase || 'phase6_production' }}
      FAST_MODE_FLAG: ${{ inputs.fast_mode == true && '--fast-mode' || '' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # match H:/codex local Python
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If a requirements.txt lives at repo root we honour it; otherwise
          # install the set eth_price_forecast uses at runtime.
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pandas scikit-learn scipy catboost \
                        lightgbm xgboost yfinance requests beautifulsoup4 \
                        python-dateutil
          fi

      - name: Restore deployed forecast DB
        # The deploy branch is force-rebuilt every run, so the live SQLite DB
        # must be copied back before inserting today's forecast. Without this
        # step forecast_runs starts at run_id=1 every day, history.json stays
        # empty, and resolved live accuracy never accumulates.
        run: |
          mkdir -p forecast_site
          git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast || true
          if git show origin/data/daily-forecast:forecast_site/predictions.db \
              > forecast_site/predictions.db 2>/dev/null; then
            python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("forecast_site/predictions.db")
          counts = {}
          for table in ("forecast_runs", "forecasts", "actuals", "accuracy_snapshot"):
              try:
                  counts[table] = conn.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              except sqlite3.Error:
                  counts[table] = "missing"
          conn.close()
          print("Restored deployed DB counts:", counts)
          PY
          else
            echo "No deployed DB found; starting a new forecast DB."
            rm -f forecast_site/predictions.db
          fi

      - name: Refresh market data
        run: |
          python eth_data_collector.py

      - name: Restore prediction feedback history
        # The model uses matured old forecasts as feedback features and model
        # selection penalties. Main does not track this generated CSV, so pull
        # the previous deploy-branch copy before forecasting.
        run: |
          mkdir -p eth_forecast_outputs
          git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast || true
          git show origin/data/daily-forecast:eth_forecast_outputs/prediction_history.csv \
            > eth_forecast_outputs/prediction_history.csv || true
          if [ -s eth_forecast_outputs/prediction_history.csv ]; then
            python - <<'PY'
          import pandas as pd
          frame = pd.read_csv("eth_forecast_outputs/prediction_history.csv")
          print(f"Restored prior prediction history rows: {len(frame)}")
          PY
          else
            echo "No prior prediction history found; starting feedback log."
          fi

      - name: Run forecast suite
        run: |
          python eth_price_forecast.py \
              --master-data-csv lake/gold/eth_master_daily.csv \
              --prediction-history-csv eth_forecast_outputs/prediction_history.csv \
              $FAST_MODE_FLAG

      - name: Persist forecast to DB
        run: |
          python -m forecast_site.persist_forecast \
              --summary-csv eth_forecast_outputs/latest_forecast_summary.csv \
              --model-phase "$MODEL_PHASE" \
              --code-source eth_price_forecast.py \
              --db forecast_site/predictions.db \
              ${FAST_MODE_FLAG:+--fast-mode}

      - name: Persist backtest archive to DB
        # Idempotent: already-ingested (phase, sha1) pairs are skipped, so
        # the full tests/phase0/*_metrics.json glob is safe to rerun daily.
        # New freeze JSONs committed by humans automatically flow into the DB
        # on the next cron tick.
        run: |
          python -m forecast_site.persist_backtest \
              --freeze-glob "tests/phase0/*_metrics.json" \
              --db forecast_site/predictions.db

      - name: Refresh model evaluation report
        # Cheap daily gate: re-score the committed long-run OOF metrics and
        # publish the same report the frontend reads. This does not rerun the
        # expensive 36-fold OOF job daily; that remains in eth_model_eval.yml.
        # This is the last-passing production evidence. The weekly workflow
        # publishes the newest candidate evidence separately even on FAIL.
        run: |
          python tests/phase0/threshold_sweep.py
          python scripts/evaluate_eth_candidate.py \
              --baseline tests/phase0/model_baseline_manifest.json \
              --candidate tests/phase0/phase6_production_longrun_oof_metrics.json \
              --threshold-sweep tests/phase0/threshold_sweep_results.json \
              --profile full
          cp tests/phase0/model_eval_report.json forecast_site/public/model_eval_report.json
          cp tests/phase0/model_eval_report.json forecast_site/public/model_eval_last_pass.json
          if [ ! -s forecast_site/public/model_eval_latest.json ]; then
            cp tests/phase0/model_eval_report.json forecast_site/public/model_eval_latest.json
          fi

      - name: Backfill actuals + refresh accuracy
        run: |
          python -m forecast_site.backfill_actuals \
              --master-data-csv lake/gold/eth_master_daily.csv \
              --db forecast_site/predictions.db

      - name: Export JSON blobs for frontend
        run: |
          python -m forecast_site.export_json \
              --db forecast_site/predictions.db
          python -m forecast_site.export_backtest_json \
              --db forecast_site/predictions.db
          if [ ! -s forecast_site/public/backtest_longrun_candidate_history.json ]; then
            cp forecast_site/public/backtest_longrun_history.json \
               forecast_site/public/backtest_longrun_candidate_history.json
          fi

      - name: Restore deployed donation wallet payload
        # donation_tracker is best-effort. If an explorer is down, keep the
        # previous public wallet payload instead of dropping the support card
        # from the rebuilt deploy branch.
        run: |
          mkdir -p forecast_site/public
          git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast || true
          git show origin/data/daily-forecast:forecast_site/public/donations.json \
            > forecast_site/public/donations.json || true

      - name: Refresh donation milestones
        # Rewrites forecast_site/public/donations.json (milestones_reached
        # + next_milestone; NO dollar amounts) from on-chain scans of the
        # 4 donation wallets. Non-fatal: if an explorer is rate-limited,
        # keep the previous day's donations.json on the deploy branch.
        continue-on-error: true
        run: |
          python donation_tracker.py --quiet

      - name: Send Telegram notification
        # Best-effort; the script itself no-ops if tokens are missing and
        # swallows transient failures.
        continue-on-error: true
        run: |
          python -m forecast_site.notify_telegram

      - name: Upload pipeline artifacts (debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-outputs-${{ github.run_id }}
          path: |
            eth_forecast_outputs/latest_forecast_summary.csv
            eth_forecast_outputs/prediction_history.csv
            eth_forecast_outputs/prediction_feedback_summary.csv
            eth_forecast_outputs/prediction_feedback_state_summary.csv
            eth_forecast_outputs/prediction_feedback_state_winners.csv
            eth_forecast_outputs/compact_dashboard.csv
            eth_forecast_outputs/summary.json
            lake/reports/collector_summary.json
            lake/reports/collector_data_quality_audit.json
            lake/reports/collector_data_quality_audit.csv
            lake/reports/collector_learning_exclusion_report.csv
            forecast_site/public/model_eval_report.json
            forecast_site/public/model_eval_latest.json
            forecast_site/public/model_eval_last_pass.json
            forecast_site/public/backtest_longrun_candidate_history.json
            tests/phase0/model_eval_report.json
            tests/phase0/model_eval_report.md
            tests/phase0/threshold_sweep_results.json
          retention-days: 14

      - name: Commit updated DB
        # -----------------------------------------------------------------
        # Deploy-branch pattern: data/daily-forecast keeps its own history,
        # overlays the workflow commit's site code, then layers generated
        # artifacts (DB + JSON blobs) on top as a single force-pushed commit.
        #
        # Why force-push:
        #   1. Vercel only reads the tip commit -- history on this branch
        #      has no value.
        #   2. Starting from the deploy branch avoids GitHub App workflow-file
        #      push rejection. The workflow files are preserved from the
        #      previous deploy tip; Vercel does not need them.
        #   3. Safe: the concurrency group (daily-forecast) guarantees only
        #      one workflow writes to this branch at a time.
        #
        # Every `git add` uses `-f` because most of the paths we deploy
        # (predictions.db, public/*.json) are listed in main's .gitignore.
        # -----------------------------------------------------------------
        run: |
          set -o pipefail
          git config user.name  "eth-forecast-bot"
          git config user.email "eth-forecast-bot@users.noreply.github.com"
          branch="data/daily-forecast"
          generated_dir="$RUNNER_TEMP/eth-generated"
          mkdir -p "$generated_dir/eth_forecast_outputs"
          mkdir -p "$generated_dir/forecast_site"
          mkdir -p "$generated_dir/forecast_site/public"
          mkdir -p "$generated_dir/lake/gold"
          mkdir -p "$generated_dir/lake/reports"
          cp -f eth_forecast_outputs/prediction_history.csv "$generated_dir/eth_forecast_outputs/" 2>/dev/null || true
          cp -f eth_forecast_outputs/prediction_feedback_summary.csv "$generated_dir/eth_forecast_outputs/" 2>/dev/null || true
          cp -f eth_forecast_outputs/prediction_feedback_state_summary.csv "$generated_dir/eth_forecast_outputs/" 2>/dev/null || true
          cp -f eth_forecast_outputs/prediction_feedback_state_winners.csv "$generated_dir/eth_forecast_outputs/" 2>/dev/null || true
          cp -f forecast_site/predictions.db "$generated_dir/forecast_site/" 2>/dev/null || true
          cp -f forecast_site/public/*.json "$generated_dir/forecast_site/public/" 2>/dev/null || true
          cp -f lake/gold/eth_master_daily.csv "$generated_dir/lake/gold/" 2>/dev/null || true
          cp -f lake/reports/collector_summary.json "$generated_dir/lake/reports/" 2>/dev/null || true
          cp -f lake/reports/collector_data_quality_audit.json "$generated_dir/lake/reports/" 2>/dev/null || true
          cp -f lake/reports/collector_data_quality_audit.csv "$generated_dir/lake/reports/" 2>/dev/null || true
          cp -f lake/reports/collector_learning_exclusion_report.csv "$generated_dir/lake/reports/" 2>/dev/null || true

          # Generated files are now safely copied to RUNNER_TEMP. Clean the
          # workspace so switching from main to the deploy branch cannot be
          # blocked by modified/ignored artifacts left by collector/export.
          git reset --hard "$GITHUB_SHA"
          git clean -fdx

          # Start from the current deploy branch, overlay this workflow
          # commit's code, then restore deploy-branch workflow files so the
          # GITHUB_TOKEN never attempts to update .github/workflows.
          if git fetch origin "$branch:refs/remotes/origin/$branch"; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout --orphan "$branch"
            git rm -rf . || true
          fi
          git checkout "$GITHUB_SHA" -- .
          git checkout "origin/$branch" -- .github/workflows 2>/dev/null || rm -rf .github/workflows
          cp -rf "$generated_dir"/. ./

          # Force-add generated artifacts. -f bypasses .gitignore which
          # blocks predictions.db / public/*.json on main.
          git add -f forecast_site/predictions.db || true
          git add -f lake/gold/eth_master_daily.csv || true
          git add -f \
              lake/reports/collector_summary.json \
              lake/reports/collector_data_quality_audit.json \
              lake/reports/collector_data_quality_audit.csv \
              lake/reports/collector_learning_exclusion_report.csv || true
          git add -f \
              eth_forecast_outputs/prediction_history.csv \
              eth_forecast_outputs/prediction_feedback_summary.csv \
              eth_forecast_outputs/prediction_feedback_state_summary.csv \
              eth_forecast_outputs/prediction_feedback_state_winners.csv || true
          git add -f \
              forecast_site/public/latest.json \
              forecast_site/public/accuracy.json \
              forecast_site/public/history.json \
              forecast_site/public/health.json \
              forecast_site/public/model_eval_report.json \
              forecast_site/public/model_eval_latest.json \
              forecast_site/public/model_eval_last_pass.json || true
          # Donation milestones — tiny public payload (milestones_reached +
          # next_milestone); full USD ledger stays in forecast_site/private/
          # which is hard-gitignored and never reaches the deploy branch.
          git add -f forecast_site/public/donations.json || true
          # Backtest artifacts (regenerated by export_backtest_json).
          git add -f \
              forecast_site/public/backtest.json \
              forecast_site/public/backtest_versions.json \
              forecast_site/public/backtest_longrun_history.json \
              forecast_site/public/backtest_longrun_candidate_history.json || true
          # Glob paths: git add with a pathspec that matches zero files is
          # a fatal error. Expand via shell with nullglob so empty globs
          # become no-ops rather than literal "backtest_diff_*.json".
          shopt -s nullglob
          backtest_pred=(forecast_site/public/backtest_predictions_*.json)
          backtest_diff=(forecast_site/public/backtest_diff_*.json)
          if [ ${#backtest_pred[@]} -gt 0 ]; then
            git add -f "${backtest_pred[@]}" || true
          fi
          if [ ${#backtest_diff[@]} -gt 0 ]; then
            git add -f "${backtest_diff[@]}" || true
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(forecast): daily run $(date -u +%Y-%m-%d)" \
                     -m "model_phase=$MODEL_PHASE"
          # Force-push: see header comment. Concurrency group ensures no
          # concurrent writer can be clobbered.
          git push --force origin "$branch"

      - name: Verify deployed freshness
        run: |
          python scripts/check_site_freshness.py \
              --url https://etherforecast.live/health.json \
              --max-live-age-hours 27 \
              --max-health-age-hours 30 \
              --retries 10 \
              --retry-seconds 60

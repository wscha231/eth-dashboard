name: Daily ETH market data
on:
  push:
    branches: [main]
    paths: [".github/workflows/daily_forecast.yml", "eth_data_collector.py", "scripts/daily_source_state.py", "scripts/collect_free_research_sources.py", "scripts/materialize_pit_manual_features.py", "data_lab/free_sources.py"]
  schedule:
    - cron: "37 0 * * *"
    - cron: "37 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-forecast
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
      DERIBIT_CLIENT_ID: ${{ secrets.DERIBIT_CLIENT_ID }}
      DERIBIT_CLIENT_SECRET: ${{ secrets.DERIBIT_CLIENT_SECRET }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      DONATION_BTC_ADDRESS: ${{ secrets.DONATION_BTC_ADDRESS }}
      DONATION_ETH_ADDRESS: ${{ secrets.DONATION_ETH_ADDRESS }}
      DONATION_SOL_ADDRESS: ${{ secrets.DONATION_SOL_ADDRESS }}
      DONATION_TRX_ADDRESS: ${{ secrets.DONATION_TRX_ADDRESS }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install -r requirements-runtime.txt
      - name: Restore durable sources and archived issued records
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if ! git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast; then
            python scripts/gdrive_store.py restore --stream daily-data --target drive-daily-recovery
            mkdir -p lake forecast_site
            cp -a drive-daily-recovery/lake/. lake/
            cp -a drive-daily-recovery/forecast_site/. forecast_site/
            exit 0
          fi
          mkdir -p lake/gold forecast_site
          git show origin/data/daily-forecast:lake/gold/eth_master_daily.csv > lake/gold/eth_master_daily.csv
          git show origin/data/daily-forecast:forecast_site/predictions.db > forecast_site/predictions.db
          git show origin/data/daily-forecast:lake/gold/eth_provisional_daily.csv > lake/gold/eth_provisional_daily.csv || rm -f lake/gold/eth_provisional_daily.csv
          git show origin/data/daily-forecast:lake/gold/eth_master_daily.availability.json > lake/gold/eth_master_daily.availability.json || rm -f lake/gold/eth_master_daily.availability.json
          python scripts/daily_source_state.py restore origin/data/daily-forecast
          git show origin/data/daily-forecast:forecast_site/public/donations.json > forecast_site/public/donations.json || true
      - name: Backfill and refresh free research sources
        id: free_sources
        continue-on-error: true
        run: python scripts/collect_free_research_sources.py --output-dir lake/raw/vendor --start-date 2017-01-01
      - name: Materialize PIT-safe daily manual features
        id: pit_manual
        shell: bash
        run: |
          set -euo pipefail
          raw="lake/raw/vendor/bybit_eth_free_features.csv"
          sidecar="lake/raw/vendor/bybit_eth_free_features.availability.csv"
          safe="lake/gold/pit_manual/bybit_eth_free_features.csv"
          receipt="lake/reports/pit_manual_feature_receipt.json"
          rm -f "$safe" "$receipt"
          if [ -s "$raw" ]; then
            if [ ! -s "$sidecar" ]; then
              echo "::warning::Bybit event-date features exist without an availability sidecar; excluding them from the model-facing daily master"
            else
              python scripts/materialize_pit_manual_features.py \
                --input "$raw" \
                --availability "$sidecar" \
                --output "$safe" \
                --receipt "$receipt"
            fi
          fi
      - name: Incremental market collection
        id: collection
        shell: bash
        run: |
          extras=()
          for f in lake/gold/pit_manual/bybit_eth_free_features.csv lake/raw/vendor/fred_initial_asof_daily.csv; do
            if [ -s "$f" ]; then extras+=("$f"); fi
          done
          python eth_data_collector.py --manual-features-csv "${extras[@]}"
      - name: Settle outstanding archived forecasts without issuing retired models
        run: |
          python -m forecast_site.backfill_actuals --master-data-csv lake/gold/eth_master_daily.csv --db forecast_site/predictions.db
          python -m forecast_site.export_json --db forecast_site/predictions.db
      - name: Refresh existing donation milestones
        continue-on-error: true
        run: python donation_tracker.py --quiet
      - name: Persist fresh sources for the active hybrid pipeline
        run: |
          git config user.name "eth-forecast-bot"
          git config user.email "eth-forecast-bot@users.noreply.github.com"
          git worktree add --detach "$RUNNER_TEMP/market-site" origin/data/daily-forecast
          python scripts/deployment_policy.py --target "$RUNNER_TEMP/market-site" --stage
          mkdir -p "$RUNNER_TEMP/market-site/lake/gold" "$RUNNER_TEMP/market-site/lake/reports"
          cp lake/gold/eth_master_daily.csv lake/gold/eth_provisional_daily.csv lake/gold/eth_master_daily.availability.json "$RUNNER_TEMP/market-site/lake/gold/"
          cp lake/reports/collector_summary.json lake/reports/collector_data_quality_audit.json "$RUNNER_TEMP/market-site/lake/reports/"
          if [ -f lake/reports/free_source_backfill.json ]; then cp lake/reports/free_source_backfill.json "$RUNNER_TEMP/market-site/lake/reports/"; fi
          if [ -f lake/reports/pit_manual_feature_receipt.json ]; then cp lake/reports/pit_manual_feature_receipt.json "$RUNNER_TEMP/market-site/lake/reports/"; fi
          python scripts/daily_source_state.py persist "$RUNNER_TEMP/market-site"
          for report in collector_source_status.csv collector_learning_exclusion_report.csv; do
            if [ -f "lake/reports/$report" ]; then cp "lake/reports/$report" "$RUNNER_TEMP/market-site/lake/reports/"; fi
          done
          for report in eth_master_schema.csv external_feature_summary.csv; do
            if [ -f "lake/gold/$report" ]; then cp "lake/gold/$report" "$RUNNER_TEMP/market-site/lake/gold/"; fi
          done
          if [ -d lake/gold/pit_manual ]; then cp -a lake/gold/pit_manual "$RUNNER_TEMP/market-site/lake/gold/"; fi
          cp forecast_site/predictions.db "$RUNNER_TEMP/market-site/forecast_site/predictions.db"
          cp forecast_site/public/latest.json forecast_site/public/accuracy.json forecast_site/public/history.json forecast_site/public/issued_history.json forecast_site/public/health.json "$RUNNER_TEMP/market-site/forecast_site/public/"
          if [ -s forecast_site/public/donations.json ]; then cp forecast_site/public/donations.json "$RUNNER_TEMP/market-site/forecast_site/public/"; fi
          git -C "$RUNNER_TEMP/market-site" add -f lake/gold lake/reports forecast_site/predictions.db forecast_site/public
          for cache in lake/raw/market lake/raw/vendor; do
            if [ -d "$RUNNER_TEMP/market-site/$cache" ]; then git -C "$RUNNER_TEMP/market-site" add -f "$cache"; fi
          done
          if ! git -C "$RUNNER_TEMP/market-site" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/market-site" commit -m "chore(data): refresh sources and settle retired forecasts"
            python scripts/push_data_branch_retry.py --worktree "$RUNNER_TEMP/market-site" --branch data/daily-forecast
          fi
      - name: Preserve daily inputs and settled records independently of git publication
        id: daily_snapshot
        if: ${{ always() && (steps.collection.outcome == 'success' || steps.collection.outcome == 'failure') }}
        run: python scripts/prepare_daily_drive_snapshot.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.daily_snapshot.outcome == 'success' }}
        with:
          name: daily-source-state
          path: daily-drive-state/
          compression-level: 9
          retention-days: 7
          if-no-files-found: error

# Daily ETH forecast pipeline.
#
# Runs every morning UTC: refreshes the master dataset, runs the full forecast
# suite, persists the headline summary + hybrid scenarios into SQLite, and
# backfills any previously unresolved forecasts.
#
# Designed for commit-back-to-repo deployment: the DB file is updated in-place
# and pushed on a dedicated branch. A companion website (Next.js / static) can
# clone the branch or mirror the DB on deploy.
name: Daily ETH forecast

on:
  schedule:
    # 00:10 UTC = 09:10 KST. 10-minute offset keeps us clear of the hourly
    # top-of-hour traffic spike on free data APIs (FRED, Yahoo).
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      fast_mode:
        description: "Run eth_price_forecast in fast-mode (degraded accuracy, shorter runtime)"
        type: boolean
        default: false
      model_phase:
        description: "Model phase label written into forecast_runs"
        type: string
        default: "phase5_production"

concurrency:
  group: daily-forecast
  cancel-in-progress: false  # don't abort a mid-flight run if manually triggered again

permissions:
  contents: write  # required to push the updated DB back to the repo

jobs:
  forecast:
    # Free-tier runner has 7GB RAM + 2 cores.
    # Phase 5 full run (CatBoost + MLP + 3-fold CV) takes ~50-70 min on 2 cores.
    # Timeout bumped to 90 min; pip cache (requirements.txt) saves ~10 min on repeat runs.
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # Secrets — configure under Settings > Secrets and variables > Actions.
      FRED_API_KEY:         ${{ secrets.FRED_API_KEY }}
      GLASSNODE_API_KEY:    ${{ secrets.GLASSNODE_API_KEY }}
      DERIBIT_CLIENT_ID:    ${{ secrets.DERIBIT_CLIENT_ID }}
      DERIBIT_CLIENT_SECRET: ${{ secrets.DERIBIT_CLIENT_SECRET }}
      # Optional: Telegram alert. If unset, the notify step no-ops.
      TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
      # Non-secret tuning knobs.
      MODEL_PHASE:   ${{ inputs.model_phase || 'phase5_production' }}
      FAST_MODE_FLAG: ${{ inputs.fast_mode == true && '--fast-mode' || '' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # match H:/codex local Python
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If a requirements.txt lives at repo root we honour it; otherwise
          # install the set eth_price_forecast uses at runtime.
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pandas scikit-learn scipy catboost \
                        lightgbm xgboost yfinance requests beautifulsoup4 \
                        python-dateutil
          fi

      - name: Refresh market data
        run: |
          python eth_data_collector.py

      - name: Run forecast suite
        run: |
          python eth_price_forecast.py \
              --master-data-csv lake/gold/eth_master_daily.csv \
              $FAST_MODE_FLAG

      - name: Persist forecast to DB
        run: |
          python -m forecast_site.persist_forecast \
              --summary-csv eth_forecast_outputs/latest_forecast_summary.csv \
              --model-phase "$MODEL_PHASE" \
              --code-source eth_price_forecast.py \
              --db forecast_site/predictions.db \
              ${FAST_MODE_FLAG:+--fast-mode}

      - name: Persist backtest archive to DB
        # Idempotent: already-ingested (phase, sha1) pairs are skipped, so
        # the full tests/phase0/*_metrics.json glob is safe to rerun daily.
        # New freeze JSONs committed by humans automatically flow into the DB
        # on the next cron tick.
        run: |
          python -m forecast_site.persist_backtest \
              --freeze-glob "tests/phase0/*_metrics.json" \
              --db forecast_site/predictions.db

      - name: Backfill actuals + refresh accuracy
        run: |
          python -m forecast_site.backfill_actuals \
              --master-data-csv lake/gold/eth_master_daily.csv \
              --db forecast_site/predictions.db

      - name: Export JSON blobs for frontend
        run: |
          python -m forecast_site.export_json \
              --db forecast_site/predictions.db
          python -m forecast_site.export_backtest_json \
              --db forecast_site/predictions.db

      - name: Send Telegram notification
        # Best-effort; the script itself no-ops if tokens are missing and
        # swallows transient failures.
        continue-on-error: true
        run: |
          python -m forecast_site.notify_telegram

      - name: Upload pipeline artifacts (debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-outputs-${{ github.run_id }}
          path: |
            eth_forecast_outputs/latest_forecast_summary.csv
            eth_forecast_outputs/compact_dashboard.csv
            eth_forecast_outputs/summary.json
            lake/reports/collector_summary.json
          retention-days: 14

      - name: Commit updated DB
        # The DB + master CSV move every day; traditional output CSVs would
        # cause merge conflicts so keep them out of this branch.
        run: |
          git config user.name  "eth-forecast-bot"
          git config user.email "eth-forecast-bot@users.noreply.github.com"
          # Dedicated branch keeps main/master clean; the website can track
          # this branch directly.
          branch="data/daily-forecast"
          git fetch origin "$branch" || true
          git checkout -B "$branch" "origin/$branch" 2>/dev/null || git checkout -B "$branch"
          # Pull main's code changes (index.html, backend, schema, workflow
          # itself) onto the deploy branch. Without this step the data
          # branch diverges from main — every cron adds JSON updates but
          # code fixes like the Predicted-vs-actual 3-yr history merge
          # never reach Vercel. Merge strategy is 'ours'-biased for the
          # tracked JSON blobs (they're authored here) and 'theirs' for
          # everything else. A clean 3-way merge works because main's
          # .gitignore keeps those JSONs out of main history entirely.
          git fetch origin main
          git merge origin/main --no-edit -m "chore(deploy): sync main $(date -u +%Y-%m-%d)" || {
            echo "::warning::data/daily-forecast diverged from main and can't auto-merge; aborting merge and continuing with data-only update"
            git merge --abort || true
          }
          # The JSON blobs are gitignored locally (regenerated every run) but
          # Vercel needs them on this branch, so force-add for the deploy.
          git add forecast_site/predictions.db lake/gold/eth_master_daily.csv || true
          git add --force \
              forecast_site/public/latest.json \
              forecast_site/public/accuracy.json \
              forecast_site/public/history.json || true
          # Backtest artifacts (regenerated by export_backtest_json). The
          # predictions_*.json files are large (~15MB for phase6 longrun) —
          # include them so the frontend's lazy-loaded drill-downs work on
          # the deploy branch.
          git add --force \
              forecast_site/public/backtest.json \
              forecast_site/public/backtest_versions.json \
              forecast_site/public/backtest_longrun_history.json || true
          git add --force forecast_site/public/backtest_predictions_*.json || true
          git add --force forecast_site/public/backtest_diff_*.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(forecast): daily run $(date -u +%Y-%m-%d)" \
            -m "model_phase=$MODEL_PHASE"
          git push origin "$branch"

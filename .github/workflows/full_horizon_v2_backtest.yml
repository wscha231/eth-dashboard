name: Full horizon V2 backtest audit

on:
  pull_request:
    branches: [main]
    paths:
      - "research/model/full_horizon_v2_backtest.py"
      - "scripts/run_full_horizon_v2_backtest.py"
      - "tests/test_full_horizon_v2_backtest.py"
      - ".github/workflows/full_horizon_v2_backtest.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: full-horizon-v2-backtest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-events.txt

      - name: Install research dependencies
        run: python -m pip install -r requirements-events.txt pytest

      - name: Validate frozen full-horizon policy and gates
        run: |
          python -m pytest tests/test_full_horizon_v2_backtest.py tests/test_r2_range_volatility_wave1.py tests/test_v2_contract.py tests/test_v2_adapter.py tests/test_v2_replay.py -q
          git diff --check

      - name: Find latest compatible event research state
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name:'event-research-state',per_page:100});
            const allowed=['main','model/v2-offline-replay-20260916','model/r2-range-volatility-wave1-20260916'];
            const artifacts=data.artifacts.filter(a=>!a.expired && a.workflow_run?.head_repository_id===context.payload.repository.id && allowed.includes(a.workflow_run?.head_branch));
            artifacts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
            const artifact=artifacts[0];
            if(!artifact) core.setFailed('No compatible event-research-state artifact found');
            else {
              core.setOutput('run',String(artifact.workflow_run.id));
              core.setOutput('artifact_id',String(artifact.id));
              core.setOutput('created_at',String(artifact.created_at));
            }

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run }}
          name: event-research-state
          path: lake/signals

      - name: Run frozen six-horizon V2 audit
        run: |
          rm -rf research/results/full_horizon_v2_backtest_20260917
          python scripts/run_full_horizon_v2_backtest.py \
            --root lake/signals \
            --output research/results/full_horizon_v2_backtest_20260917
          cat research/results/full_horizon_v2_backtest_20260917/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-horizon-v2-backtest-${{ github.run_id }}
          path: research/results/full_horizon_v2_backtest_20260917/
          retention-days: 30

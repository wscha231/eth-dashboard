name: ETH hourly event watchdog
on:
  workflow_run:
    workflows: ["Hourly ETH event forecast", "Daily ETH market data", "Daily ETH source refresh", "Daily archived hybrid settlement"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "18,38 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: event-watchdog
  cancel-in-progress: false
jobs:
  freshness:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.id == github.event.repository.id && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Independently check public timestamps and delayed status
        id: health
        continue-on-error: true
        run: python scripts/verify_event_site.py --require-ready
      - name: Request a bounded recovery only when the shared workers are idle
        id: recovery
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const recover = require('./scripts/event_recovery.cjs');
            await recover({github, context, core});
      - name: Preserve slot-keyed control evidence
        if: always()
        uses: actions/github-script@v7
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          RECOVERY_EVIDENCE: ${{ steps.recovery.outputs.recovery_evidence }}
        with:
          script: |
            const receipt = require('./scripts/watchdog_control_receipt.cjs');
            await receipt.collect({github, context, env: process.env});
      - name: Upload watchdog control receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-watchdog-control-receipt
          path: watchdog-control/receipt.json
          if-no-files-found: error
          retention-days: 30

name: ETH hourly event watchdog
on:
  workflow_run:
    workflows: ["Hourly ETH event forecast", "Daily ETH market data", "Daily ETH source refresh", "Daily archived hybrid settlement"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "38 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: event-watchdog
  cancel-in-progress: false
jobs:
  freshness:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.id == github.event.repository.id && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Independently check public timestamps and delayed status
        id: health
        continue-on-error: true
        run: python scripts/verify_event_site.py --require-ready
      - name: Request a bounded recovery only when the shared workers are idle
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const recover = require('./scripts/event_recovery.cjs');
            await recover({github, context, core});

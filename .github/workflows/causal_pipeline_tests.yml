name: Causal daily pipeline tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: causal-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install -r requirements-runtime.txt -r requirements-hybrid.txt -r requirements-events.txt pytest
      - run: python -m pytest tests -q
      - run: git diff --check

  exogenous-screen:
    if: github.head_ref == 'research/exogenous-source-ablation-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install fixed research dependencies
        run: python -m pip install -r requirements-runtime.txt tabulate
      - name: Restore pinned daily research inputs from data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data/daily-forecast:refs/remotes/origin/data/daily-forecast
          input="$RUNNER_TEMP/exogenous-input"
          mkdir -p "$input"
          git show origin/data/daily-forecast:lake/gold/eth_master_daily.csv > "$input/eth_master_daily.csv"
          for file in \
            bitget_eth_free_features.csv \
            hyperliquid_eth_free_features.csv \
            deribit_eth_dvol_daily.csv \
            fred_initial_asof_daily.csv \
            defillama_ethereum_chain_tvl_daily.csv \
            defillama_ethereum_dex_volume_daily.csv \
            defillama_ethereum_stablecoins_daily.csv; do
            git show "origin/data/daily-forecast:lake/raw/vendor/$file" > "$input/$file"
          done
          sha256sum "$input"/* | sort
      - name: Run frozen exogenous source-family screen
        run: |
          python research/model_lab/exogenous_family_screen.py \
            --input-root "$RUNNER_TEMP/exogenous-input" \
            --output-dir research-output
          cat research-output/REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: exogenous-family-screen-${{ github.run_id }}
          path: research-output/
          compression-level: 9
          retention-days: 7
          if-no-files-found: error

name: Causal daily pipeline tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: causal-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install -r requirements-runtime.txt -r requirements-hybrid.txt -r requirements-events.txt pytest
      - run: python -m pytest tests -q
      - run: git diff --check

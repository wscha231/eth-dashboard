name: DATA refresh freshness guard
on:
  push:
    branches: [main]
    paths:
      - config/data_source_registry.json
      - config/data_source_registry_existing_supplement.json
      - scripts/data_refresh_status.py
      - scripts/persist_data_branch_overlay.py
      - tests/test_data_refresh_status.py
      - tests/test_persist_data_branch_overlay.py
      - .github/workflows/data_refresh_guard.yml
  schedule:
    - cron: "41 5,11,17,23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-refresh-guard
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install -r requirements-runtime.txt pytest
      - name: Restore current research caches
        run: |
          if git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast; then
            python scripts/daily_source_state.py restore origin/data/daily-forecast
          fi
      - name: Test freshness policy and branch persistence
        run: python -m pytest tests/test_data_refresh_status.py tests/test_persist_data_branch_overlay.py -q
      - name: Evaluate source freshness
        run: python scripts/data_refresh_status.py --fail-on-critical-stale
      - name: Persist refresh status with retryable overlay
        if: always()
        run: |
          python scripts/persist_data_branch_overlay.py \
            --message "chore(data): update source freshness status" \
            --file lake/reports/data_refresh_status.json \
            --file lake/reports/data_refresh_status.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-refresh-status
          path: |
            lake/reports/data_refresh_status.json
            lake/reports/data_refresh_status.csv
          retention-days: 30
          if-no-files-found: warn

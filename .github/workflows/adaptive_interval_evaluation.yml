name: Adaptive interval evaluation

on:
  pull_request:
    paths:
      - "forecasting/adaptive_intervals.py"
      - "scripts/evaluate_adaptive_intervals.py"
      - "tests/test_adaptive_intervals.py"
      - "tests/phase0/adaptive_interval_gate_metrics.json"
      - ".github/workflows/adaptive_interval_evaluation.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Engineering smoke or authoritative historical evaluation"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: adaptive-interval-evaluation-${{ github.ref }}-${{ inputs.profile || 'smoke' }}
  cancel-in-progress: true

env:
  EVAL_PROFILE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.profile }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch immutable market-data reference
        run: >-
          git fetch --no-tags origin
          refs/heads/data/daily-forecast:refs/remotes/origin/data/daily-forecast

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: >-
          python -m pip install
          numpy pandas scikit-learn scipy yfinance pytest

      - name: Unit, maturity, and frozen-evidence tests
        run: python -m pytest -q tests/test_adaptive_intervals.py

      - name: Run matched-date interval evaluation
        id: adaptive_interval
        continue-on-error: true
        run: |
          if [[ "$EVAL_PROFILE" == "full" ]]; then
            bootstrap_samples=2000
          else
            bootstrap_samples=200
          fi
          python scripts/evaluate_adaptive_intervals.py \
            --profile "$EVAL_PROFILE" \
            --data-git-ref origin/data/daily-forecast \
            --bootstrap-samples "$bootstrap_samples" \
            --output "${RUNNER_TEMP}/adaptive-interval.json" \
            --markdown-output "${RUNNER_TEMP}/adaptive-interval.md"

      - name: Verify offline infrastructure gate
        run: |
          test -s "${RUNNER_TEMP}/adaptive-interval.json"
          jq -e '.gate.infrastructure_status == "PASS"' \
            "${RUNNER_TEMP}/adaptive-interval.json"
          if [[ "$EVAL_PROFILE" == "smoke" ]]; then
            jq -e '.gate.gate_status == "PASS"' \
              "${RUNNER_TEMP}/adaptive-interval.json"
          fi

      - name: Upload offline review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-interval-${{ github.run_id }}-${{ env.EVAL_PROFILE }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/adaptive-interval.json
            ${{ runner.temp }}/adaptive-interval.md

name: ETH model evaluation

on:
  pull_request:
    paths:
      - "eth_price_forecast.py"
      - "eth_data_collector.py"
      - "requirements.txt"
      - "scripts/evaluate_eth_candidate.py"
      - "tests/phase0/**"
      - ".github/workflows/eth_model_eval.yml"
  workflow_dispatch:
    inputs:
      full_run:
        description: "Run the full 36-fold OOF gate instead of the PR smoke gate"
        type: boolean
        default: false
  schedule:
    # Weekly full gate after the Sunday UTC close, Monday 03:00 KST.
    - cron: "0 18 * * 0"

permissions:
  contents: write

concurrency:
  group: eth-model-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full_run != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: "1"
      FULL_RUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full_run == 'true')) && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore latest deployed master data
        run: |
          git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast || true
          mkdir -p lake/gold
          if git show origin/data/daily-forecast:lake/gold/eth_master_daily.csv \
              > lake/gold/eth_master_daily.csv 2>/dev/null; then
            python - <<'PY'
          import csv
          with open("lake/gold/eth_master_daily.csv", newline="", encoding="utf-8") as fh:
              reader = csv.DictReader(fh)
              date_col = next((c for c in ("timestamp", "date", "Date") if c in (reader.fieldnames or [])), None)
              timestamps = [row.get(date_col) for row in reader if date_col and row.get(date_col)]
          if not timestamps:
              raise SystemExit("Restored deployed master has no timestamp/date rows")
          print(f"Restored deployed master rows={len(timestamps)} span={min(timestamps)} -> {max(timestamps)}")
          PY
          else
            echo "No deployed master data found; using repository copy."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Static leakage and feature tests
        run: |
          pytest tests/phase0/test_feature_sanity.py tests/phase0/test_leakage_audit.py -q

      - name: Long-run OOF candidate
        run: |
          if [ "$FULL_RUN" = "true" ]; then
            echo "EVAL_PROFILE=full" >> "$GITHUB_ENV"
            python tests/phase0/longrun_oof_phase6_production.py \
              --master-data-csv lake/gold/eth_master_daily.csv
          else
            echo "EVAL_PROFILE=smoke" >> "$GITHUB_ENV"
            python tests/phase0/longrun_oof_phase6_production.py \
              --master-data-csv lake/gold/eth_master_daily.csv \
              --fold-start 33 \
              --max-folds 3
          fi

      - name: Threshold sweep
        run: |
          if [ "$EVAL_PROFILE" = "full" ]; then
            python tests/phase0/threshold_sweep.py
          else
            echo "Skipping threshold sweep for smoke profile"
          fi

      - name: Candidate evaluation gate
        run: |
          status=0
          if [ "$EVAL_PROFILE" = "full" ]; then
            python scripts/evaluate_eth_candidate.py \
              --baseline tests/phase0/model_baseline_manifest.json \
              --candidate tests/phase0/phase6_production_longrun_oof_metrics.json \
              --threshold-sweep tests/phase0/threshold_sweep_results.json \
              --profile full || status=$?
          else
            python scripts/evaluate_eth_candidate.py \
              --baseline tests/phase0/model_baseline_manifest.json \
              --candidate tests/phase0/phase6_production_longrun_oof_metrics.json \
              --profile smoke || status=$?
          fi
          if [ -f tests/phase0/model_eval_report.md ]; then
            cat tests/phase0/model_eval_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload model evaluation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-model-eval-${{ github.run_id }}
          path: |
            tests/phase0/model_eval_report.json
            tests/phase0/model_eval_report.md
            tests/phase0/phase6_production_longrun_oof_metrics.json
            tests/phase0/threshold_sweep_results.json
          retention-days: 21

  evaluate-full-horizon:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        horizon: [7, 30]
        chunk: [0, 1, 2, 3, 4, 5]
    env:
      PYTHONUNBUFFERED: "1"
      FOLDS_PER_CHUNK: "6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore latest deployed master data
        run: |
          git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast || true
          mkdir -p lake/gold
          if git show origin/data/daily-forecast:lake/gold/eth_master_daily.csv \
              > lake/gold/eth_master_daily.csv 2>/dev/null; then
            python - <<'PY'
          import csv
          with open("lake/gold/eth_master_daily.csv", newline="", encoding="utf-8") as fh:
              reader = csv.DictReader(fh)
              date_col = next((c for c in ("timestamp", "date", "Date") if c in (reader.fieldnames or [])), None)
              timestamps = [row.get(date_col) for row in reader if date_col and row.get(date_col)]
          if not timestamps:
              raise SystemExit("Restored deployed master has no timestamp/date rows")
          print(f"Restored deployed master rows={len(timestamps)} span={min(timestamps)} -> {max(timestamps)}")
          PY
          else
            echo "No deployed master data found; using repository copy."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Static leakage and feature tests
        run: |
          pytest tests/phase0/test_feature_sanity.py tests/phase0/test_leakage_audit.py -q

      - name: Long-run OOF horizon
        run: |
          fold_start=$(( ${{ matrix.chunk }} * FOLDS_PER_CHUNK ))
          python tests/phase0/longrun_oof_phase6_production.py \
            --master-data-csv lake/gold/eth_master_daily.csv \
            --horizons ${{ matrix.horizon }} \
            --fold-start "$fold_start" \
            --max-folds "$FOLDS_PER_CHUNK" \
            --output-json tests/phase0/phase6_production_longrun_oof_metrics_h${{ matrix.horizon }}_c${{ matrix.chunk }}.json

      - name: Upload horizon artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-model-eval-h${{ matrix.horizon }}-c${{ matrix.chunk }}-${{ github.run_id }}
          path: |
            tests/phase0/phase6_production_longrun_oof_metrics_h${{ matrix.horizon }}_c${{ matrix.chunk }}.json
          retention-days: 21

  evaluate-full-gate:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: evaluate-full-horizon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore latest deployed master data
        run: |
          git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast || true
          mkdir -p lake/gold
          if git show origin/data/daily-forecast:lake/gold/eth_master_daily.csv \
              > lake/gold/eth_master_daily.csv 2>/dev/null; then
            python - <<'PY'
          import csv
          with open("lake/gold/eth_master_daily.csv", newline="", encoding="utf-8") as fh:
              reader = csv.DictReader(fh)
              date_col = next((c for c in ("timestamp", "date", "Date") if c in (reader.fieldnames or [])), None)
              timestamps = [row.get(date_col) for row in reader if date_col and row.get(date_col)]
          if not timestamps:
              raise SystemExit("Restored deployed master has no timestamp/date rows")
          print(f"Restored deployed master rows={len(timestamps)} span={min(timestamps)} -> {max(timestamps)}")
          PY
          else
            echo "No deployed master data found; using repository copy."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download horizon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: eth-model-eval-h*-c*-${{ github.run_id }}
          path: tests/phase0/full_horizon_artifacts
          merge-multiple: true

      - name: Merge horizon metrics
        run: |
          python tests/phase0/merge_longrun_oof_metrics.py \
            tests/phase0/full_horizon_artifacts/phase6_production_longrun_oof_metrics_h*_c*.json \
            --output tests/phase0/phase6_production_longrun_oof_metrics.json \
            --finalize-master-data-csv lake/gold/eth_master_daily.csv

      - name: Threshold sweep
        run: |
          python tests/phase0/threshold_sweep.py

      - name: Candidate evaluation gate
        id: candidate_gate
        run: |
          status=0
          python scripts/evaluate_eth_candidate.py \
            --baseline tests/phase0/model_baseline_manifest.json \
            --candidate tests/phase0/phase6_production_longrun_oof_metrics.json \
              --threshold-sweep tests/phase0/threshold_sweep_results.json \
              --profile full || status=$?
          if [ -s tests/phase0/model_eval_report.md ]; then
            cat tests/phase0/model_eval_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ! -s tests/phase0/model_eval_report.json ]; then
            echo "Candidate evaluator did not produce a report." >&2
            exit "${status:-1}"
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "gate_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate_passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare public evaluation evidence
        run: |
          mkdir -p forecast_site/public
          cp tests/phase0/model_eval_report.json forecast_site/public/model_eval_latest.json
          python -m forecast_site.export_candidate_eval \
              --candidate tests/phase0/phase6_production_longrun_oof_metrics.json \
              --report tests/phase0/model_eval_report.json \
              --output forecast_site/public/backtest_longrun_candidate_history.json
          if [ "${{ steps.candidate_gate.outputs.gate_passed }}" = "true" ]; then
            cp tests/phase0/model_eval_report.json forecast_site/public/model_eval_last_pass.json
            cp tests/phase0/model_eval_report.json forecast_site/public/model_eval_report.json
          fi

      - name: Publish latest evidence and gated production artifacts
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config user.name  "eth-forecast-bot"
          git config user.email "eth-forecast-bot@users.noreply.github.com"
          git add \
              forecast_site/public/model_eval_latest.json \
              forecast_site/public/backtest_longrun_candidate_history.json
          if [ "${{ steps.candidate_gate.outputs.gate_passed }}" = "true" ]; then
            git add \
                tests/phase0/phase6_production_longrun_oof_metrics.json \
                forecast_site/public/model_eval_last_pass.json \
                forecast_site/public/model_eval_report.json
          fi
          if git diff --cached --quiet; then
            echo "Evaluation evidence is already current."
            exit 0
          fi
          git commit -m "chore(eval): publish latest OOF evidence $(date -u +%Y-%m-%d)" \
                     -m "gate_passed=${{ steps.candidate_gate.outputs.gate_passed }}"
          git push origin HEAD:main

      - name: Upload full evaluation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-model-eval-full-${{ github.run_id }}
          path: |
            tests/phase0/model_eval_report.json
            tests/phase0/model_eval_report.md
            tests/phase0/phase6_production_longrun_oof_metrics.json
            tests/phase0/threshold_sweep_results.json
            forecast_site/public/model_eval_latest.json
            forecast_site/public/model_eval_last_pass.json
            forecast_site/public/backtest_longrun_candidate_history.json
          retention-days: 21

      - name: Enforce candidate promotion gate
        if: ${{ always() && steps.candidate_gate.outputs.exit_code != '' }}
        run: |
          exit "${{ steps.candidate_gate.outputs.exit_code }}"

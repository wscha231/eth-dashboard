name: HAR-RV clock robustness audit

on:
  pull_request:
    branches: [main]
    paths:
      - "research/model/har_rv_clock_robustness.py"
      - "tests/test_har_rv_clock_robustness.py"
      - ".github/workflows/har_rv_clock_robustness.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: har-rv-clock-robustness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-events.txt

      - name: Install research dependencies
        run: python -m pip install -r requirements-events.txt pytest

      - name: Validate frozen clock-robustness policy
        run: |
          python -m pytest tests/test_har_rv_clock_robustness.py tests/test_r2_range_volatility_wave1.py -q
          git diff --check

      - name: Find latest trusted main event research state
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name:'event-research-state',per_page:100});
            const artifacts=data.artifacts.filter(a=>!a.expired && a.workflow_run?.head_repository_id===context.payload.repository.id && a.workflow_run?.head_branch==='main');
            artifacts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
            const artifact=artifacts[0];
            if(!artifact) core.setFailed('No trusted main event-research-state artifact found');
            else {
              core.setOutput('run',String(artifact.workflow_run.id));
              core.setOutput('artifact_id',String(artifact.id));
              core.setOutput('created_at',String(artifact.created_at));
            }

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run }}
          name: event-research-state
          path: lake/signals

      - name: Run frozen all-clock HAR-RV audit
        run: |
          rm -rf research/results/har_rv_clock_robustness_20260918
          python -m research.model.har_rv_clock_robustness \
            --root lake/signals \
            --output research/results/har_rv_clock_robustness_20260918
          cat research/results/har_rv_clock_robustness_20260918/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: har-rv-clock-robustness-${{ github.run_id }}
          path: research/results/har_rv_clock_robustness_20260918/
          retention-days: 30
          if-no-files-found: warn

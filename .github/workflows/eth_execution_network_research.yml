name: ETH execution network research

on:
  pull_request:
    branches: [main]
    paths:
      - data_lab/eth_execution_network.py
      - scripts/collect_eth_execution_network.py
      - scripts/audit_r3_research_sources.py
      - tests/test_eth_execution_network.py
      - tests/test_r3_research_source_audit.py
      - research/r3_eth_execution_network_v1_20260918/**
      - config/r3_research_source_registry.json
      - .github/workflows/eth_execution_network_research.yml
      - scripts/archive_r3_research_to_drive.py
      - .github/workflows/r3_research_drive_archive.yml
      - tests/test_r3_drive_archive.py
  push:
    branches: [main]
    paths:
      - data_lab/eth_execution_network.py
      - scripts/collect_eth_execution_network.py
      - scripts/audit_r3_research_sources.py
      - tests/test_eth_execution_network.py
      - tests/test_r3_research_source_audit.py
      - research/r3_eth_execution_network_v1_20260918/**
      - config/r3_research_source_registry.json
      - .github/workflows/eth_execution_network_research.yml
      - scripts/archive_r3_research_to_drive.py
      - .github/workflows/r3_research_drive_archive.yml
      - tests/test_r3_drive_archive.py
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: eth-execution-network-research-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
      ETHEREUM_RPC_AUTHORIZED: ${{ vars.ETHEREUM_RPC_AUTHORIZED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test finalized execution-network contracts
        if: ${{ github.event_name != 'schedule' }}
        run: |
          python -m unittest discover -s tests -p 'test_eth_execution_network.py' -v
          python scripts/audit_r3_research_sources.py --output r3-source-audit/report.json
          git diff --check

      - name: Gate authorized RPC transport
        id: transport
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pull-request validation is offline by policy; no external RPC call will be made."
          elif [ -n "$ETHEREUM_RPC_URL" ] && [ "${ETHEREUM_RPC_AUTHORIZED,,}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Authorized RPC transport gate: enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Authorized RPC transport gate: blocked. No external RPC call will be made."
          fi

      - name: Find previous successful execution-network state
        if: steps.transport.outputs.enabled == 'true'
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name:'eth-execution-network-research-state',per_page:100});
            const allowed=['main'];
            if(context.eventName==='push') {
              const {data:prs}=await github.rest.repos.listPullRequestsAssociatedWithCommit({...context.repo,commit_sha:context.sha});
              for(const pr of prs) if(pr.merged_at && pr.merge_commit_sha===context.sha && pr.head.repo?.full_name===`${context.repo.owner}/${context.repo.repo}`) allowed.push(pr.head.ref);
            }
            const artifact=data.artifacts.find(a=>!a.expired && a.workflow_run?.head_repository_id===context.payload.repository.id && allowed.includes(a.workflow_run?.head_branch));
            if(artifact) core.setOutput('run',artifact.workflow_run.id);

      - uses: actions/download-artifact@v4
        if: steps.transport.outputs.enabled == 'true' && steps.previous.outputs.run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run }}
          name: eth-execution-network-research-state
          path: lake/research/eth_execution_network

      - name: Collect finalized execution-network receipts
        if: steps.transport.outputs.enabled == 'true'
        run: |
          python scripts/collect_eth_execution_network.py \
            --root lake/research/eth_execution_network \
            --max-blocks 420 \
            --transport-authorized

      - name: Write fail-closed report when transport is unavailable
        if: steps.transport.outputs.enabled != 'true'
        run: |
          python scripts/collect_eth_execution_network.py \
            --root lake/research/eth_execution_network \
            --allow-blocked

      - name: Verify rights, PIT and collection gate
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('lake/research/eth_execution_network/report.json')
          d=json.loads(p.read_text())
          assert d['public_redistribution']=='blocked'
          assert d['model_use'].startswith('blocked_')
          assert d['site_use']=='blocked'
          assert d['paid_product_use']=='blocked'
          assert d['production_effect']=='none'
          if d['collection_state']=='research_active_authorized_transport':
              assert d['transport_authorization_attested'] is True
              assert int(d['total_receipt_rows']) >= 1
              assert len(d['run_raw_sha256']) == 64
              assert int(d['last_finalized_block']) > 0
          else:
              assert d['collection_state'] in {
                  'blocked_missing_authorized_rpc',
                  'blocked_rpc_rights_not_attested',
              }
              assert int(d['new_receipt_rows']) == 0
          print(json.dumps(d, sort_keys=True))
          PY

      - name: Upload execution-network research state
        if: steps.transport.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eth-execution-network-research-state
          path: lake/research/eth_execution_network/
          compression-level: 9
          retention-days: 30
          if-no-files-found: error

      - name: Summarize execution-network gate
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('lake/research/eth_execution_network/report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## R3 P1 Ethereum execution-network research\n\n')
              if not p.exists():
                  f.write('No report produced. MODEL/site promotion is forbidden.\n')
              else:
                  d=json.loads(p.read_text())
                  for key in ('status','collection_state','history_mode','new_receipt_rows','total_receipt_rows','prospective_rows','last_finalized_block','rights_status'):
                      if key in d: f.write(f'- {key}: `{d.get(key)}`\n')
                  f.write('\nMODEL/site/public/paid use remain blocked.\n')
          PY

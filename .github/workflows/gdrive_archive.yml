name: Durable Google Drive archive
on:
  push:
    branches: [main]
    paths:
      - scripts/gdrive_store.py
      - scripts/archive_to_drive.py
      - scripts/prepare_daily_drive_snapshot.py
      - .github/workflows/gdrive_archive.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/gdrive_store.py
      - scripts/archive_to_drive.py
      - scripts/prepare_daily_drive_snapshot.py
      - tests/test_gdrive_storage.py
      - .github/workflows/gdrive_archive.yml
      - .github/workflows/gdrive_restore.yml
  workflow_run:
    workflows: ["Hourly ETH event forecast", "Daily ETH market data", "ETH hourly event research", "ETH multi-year candidate study", "Daily archived hybrid settlement", "Daily ETH source refresh"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "19 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gdrive-archive-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_gdrive*.py' -v
  archive:
    needs: self-test
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve sources, forecasts, model checkpoints and research revisions
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -n "$SOURCE_RUN" ]; then
            python scripts/archive_to_drive.py --source-run "$SOURCE_RUN"
          else
            python scripts/archive_to_drive.py
          fi
      - name: Preserve the small automation status even after an archive failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-archive-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: drive-archive-status/
          retention-days: 30
          if-no-files-found: warn

name: Lead-signal source ablation

on:
  pull_request:
    paths:
      - "forecasting/tail_evaluation.py"
      - "scripts/evaluate_lead_signal_ablation.py"
      - "tests/test_evaluate_lead_signal_ablation.py"
      - "tests/test_tail_evaluation.py"
      - "tests/phase0/lead_signal_source_ablation_metrics.json"
      - ".github/workflows/lead_signal_source_ablation.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Engineering smoke or authoritative historical evaluation"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: lead-signal-source-ablation-${{ github.ref }}-${{ inputs.profile || 'smoke' }}
  cancel-in-progress: true

env:
  EVAL_PROFILE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.profile }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch immutable market-data reference
        run: >-
          git fetch --no-tags origin
          refs/heads/data/daily-forecast:refs/remotes/origin/data/daily-forecast

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: >-
          python -m pip install
          numpy pandas scikit-learn scipy yfinance pytest

      - name: Unit, leakage, and frozen-evidence tests
        run: >-
          python -m pytest -q
          tests/test_tail_evaluation.py
          tests/test_evaluate_lead_signal_ablation.py

      - name: Run matched-date source ablation
        id: source_ablation
        continue-on-error: true
        run: |
          if [[ "$EVAL_PROFILE" == "full" ]]; then
            bootstrap_samples=2000
          else
            bootstrap_samples=200
          fi
          python scripts/evaluate_lead_signal_ablation.py \
            --profile "$EVAL_PROFILE" \
            --data-git-ref origin/data/daily-forecast \
            --nonlinear histgradient \
            --bootstrap-samples "$bootstrap_samples" \
            --output "${RUNNER_TEMP}/lead-signal-ablation.json" \
            --markdown-output "${RUNNER_TEMP}/lead-signal-ablation.md"

      - name: Verify offline infrastructure gate
        run: |
          test -s "${RUNNER_TEMP}/lead-signal-ablation.json"
          jq -e '.gate.infrastructure_status == "PASS"' \
            "${RUNNER_TEMP}/lead-signal-ablation.json"
          if [[ "$EVAL_PROFILE" == "smoke" ]]; then
            jq -e '.gate.gate_status == "PASS"' \
              "${RUNNER_TEMP}/lead-signal-ablation.json"
          fi

      - name: Upload offline review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-signal-source-ablation-${{ github.run_id }}-${{ env.EVAL_PROFILE }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/lead-signal-ablation.json
            ${{ runner.temp }}/lead-signal-ablation.md

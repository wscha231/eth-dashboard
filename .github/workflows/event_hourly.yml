name: Hourly ETH event forecast
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/event_hourly.yml
      - .github/workflows/event_watchdog.yml
      - scripts/event_recovery.cjs
      - scripts/deployment_policy.py
      - ops/deployment_cooldown.json
      - scripts/archive_event_inputs.py
      - scripts/audit_event_system.py
      - scripts/audit_forecast_continuity.py
      - scripts/wait_event_release.py
      - scripts/run_optional_dense.py
      - scripts/run_variance_shadow.py
      - scripts/run_hourly_variance_shadow.sh
      - scripts/persist_variance_ledger.sh
      - signal_pipeline/variance_shadow.py
      - scripts/availability_shadow.py
      - scripts/run_availability_shadow.sh
      - scripts/review_forecast_failures.py
      - scripts/recovery_health.py
      - scripts/build_automation_health.py
      - scripts/persist_event_ledger.sh
      - scripts/event_state.py
      - scripts/refresh_event_state.py
      - scripts/build_operation_health.py
      - scripts/verify_event_site.py
      - scripts/publish_events.sh
      - scripts/publish_search_assets.py
      - scripts/export_event_segments.py
      - scripts/run_variance_dense_shadow.py
      - signal_pipeline/variance_dense_shadow.py
      - forecast_site/public/events.js
      - forecast_site/public/event_diagnostics.js
      - forecast_site/public/index.html
      - forecast_site/public/sitemap.xml
      - forecast_site/public/robots.txt
      - scripts/copy_event_evidence.py
      - scripts/publish_event_feed.py
      - signal_pipeline/range_candidate.py
      - research/range_shadow_20260914/seed.json
      - forecast_site/vercel.json
  workflow_run:
    workflows: ["ETH hourly event research", "Daily archived hybrid settlement", "ETH multi-year candidate study"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-forecast
  cancel-in-progress: false
jobs:
  forecast:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-events.txt
      - run: python -m pip install -r requirements-events.txt
      - name: Locate latest trusted durable hourly ledger
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0,10);
            let latestHourly = null, dailyBackup = null;
            for (const [name,key,workflow] of [['event-final-state','hourly','event_hourly.yml'],['event-hourly-state','hourly','event_hourly.yml'],['event-daily-backup','daily','event_hourly.yml']]) {
              const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name,per_page:100});
              for(const a of data.artifacts) {
                if(a.expired || a.workflow_run?.head_branch!=='main' || a.workflow_run?.head_repository_id!==context.payload.repository.id)continue;
                const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:a.workflow_run.id});
                if(!run.path.endsWith('/'+workflow) || run.event==='pull_request')continue;
                const candidate={run:a.workflow_run.id,name,created:a.created_at};
                if(key==='daily')dailyBackup=candidate;
                if(!latestHourly || Date.parse(candidate.created)>Date.parse(latestHourly.created))latestHourly=candidate;
                break;
              }
            }
            if(latestHourly) {
              core.setOutput('hourly',latestHourly.run);
              core.setOutput('hourly_name',latestHourly.name);
            }
            core.setOutput('backup',String(!dailyBackup || dailyBackup.created?.slice(0,10)!==today));
      - uses: actions/download-artifact@v4
        id: hourly_download
        continue-on-error: true
        if: steps.state.outputs.hourly != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.state.outputs.hourly }}
          name: ${{ steps.state.outputs.hourly_name }}
          path: lake/signals
      - name: Recover committed Drive state when disposable artifacts are unavailable
        if: steps.state.outputs.hourly == '' || steps.hourly_download.outcome != 'success'
        continue-on-error: true
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/gdrive_store.py restore --stream event-hourly --target drive-hourly-recovery --optional
          python - <<'PY'
          import pathlib,shutil
          source=pathlib.Path('drive-hourly-recovery')
          if source.exists():
              target=pathlib.Path('lake/signals')
              if target.exists():shutil.rmtree(target)
              target.parent.mkdir(parents=True,exist_ok=True)
              source.replace(target)
          PY
      - name: Check restored current-month checkpoints without fitting
        id: restored
        run: python scripts/refresh_event_state.py check
      - name: Locate trusted compatible research update
        id: bootstrap_research
        if: steps.restored.outputs.ready != 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),p='lake/signals/research_run.txt';
            const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name:'event-research-state',per_page:100});
            for(const a of data.artifacts) {
              if(a.expired || a.workflow_run?.head_branch!=='main' || a.workflow_run?.head_repository_id!==context.payload.repository.id)continue;
              const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:a.workflow_run.id});
              if(run.path!=='.github/workflows/event_research.yml' || run.event==='pull_request' || run.conclusion!=='success')continue;
              core.setOutput('run',String(run.id));
              break;
            }
      - uses: actions/download-artifact@v4
        id: bootstrap_download
        if: steps.bootstrap_research.outputs.run != ''
        continue-on-error: true
        timeout-minutes: 2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.bootstrap_research.outputs.run }}
          name: event-research-state
          path: lake/bootstrap-research-input
      - name: Bootstrap only when no compatible restored checkpoint is usable
        id: bootstrap_install
        if: steps.bootstrap_download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          RESEARCH_RUN: ${{ steps.bootstrap_research.outputs.run }}
        run: python scripts/refresh_event_state.py research --source lake/bootstrap-research-input --source-run "$RESEARCH_RUN" --report operation-health/bootstrap.json
      - name: Require restored replay and checkpoint manifest before issuance
        run: test -s lake/signals/replay.json && test -s lake/signals/active.json
      - name: Collect closed bars, settle matured outcomes and infer from saved models
        id: inference
        run: |
          if git ls-remote --exit-code --heads origin data/event-ledger > /dev/null; then
            git fetch origin data/event-ledger:refs/remotes/origin/data/event-ledger
            git show origin/data/event-ledger:lake/event-ledger/issued.db > lake/signals/issued.db
          fi
          if git cat-file -e origin/data/event-ledger:lake/event-ledger/shadow_issued.db 2>/dev/null; then
            mkdir -p lake/signals/shadow
            git show origin/data/event-ledger:lake/event-ledger/shadow_issued.db > lake/signals/shadow/issued.db
          fi
          if git cat-file -e origin/data/event-ledger:lake/event-ledger/range_issued.db 2>/dev/null; then
            mkdir -p lake/signals/range_shadow
            git show origin/data/event-ledger:lake/event-ledger/range_issued.db > lake/signals/range_shadow/issued.db
          fi
          python scripts/run_event_forecast.py --collect --daily --review --horizons 6 24 72 168 336 720
      - name: Report all horizon evidence and source readiness
        run: |
          python scripts/audit_event_system.py
          cat lake/signals/system_audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the issuance audit before publication
        run: bash scripts/persist_event_ledger.sh
      - name: Consistent durable snapshot before any public release
        run: python scripts/event_state.py snapshot lake/signals hourly-state
      - uses: actions/upload-artifact@v4
        with:
          name: event-hourly-state
          path: hourly-state/
          compression-level: 9
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'ETH hourly event research') || steps.state.outputs.backup == 'true' }}
        with:
          name: event-daily-backup
          path: hourly-state/
          compression-level: 9
          retention-days: 90
      - name: Publish event probabilities, price ranges and immutable results
        id: publication
        run: bash scripts/publish_events.sh
      - name: Issue frozen all-horizon HAR-RV at the 00UTC slot
        id: variance_daily
        if: ${{ always() && steps.inference.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: bash scripts/run_hourly_variance_shadow.sh
      - name: Record received-input CENTER availability shadow
        id: availability_shadow
        if: ${{ always() && (steps.inference.outcome == 'success' || steps.inference.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          CORE_PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        run: bash scripts/run_availability_shadow.sh
      # Optional dense work is intentionally AFTER core delivery. It cannot block it.
      - name: Restore authorized HAR-RV checkpoints and update dense 24h/72h shadow
        id: dense_variance
        if: ${{ always() && steps.inference.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/run_optional_dense.py --root lake/signals
      - name: Preserve only accepted optional dense results
        id: dense_persist
        if: ${{ always() && steps.dense_variance.outcome == 'success' }}
        continue-on-error: true
        run: bash scripts/persist_event_ledger.sh
      - name: Review actual forecast failures and historical coverage without model changes
        id: failure_review
        if: ${{ always() && steps.inference.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python scripts/review_forecast_failures.py --root lake/signals
          cat lake/signals/failure_review.md >> "$GITHUB_STEP_SUMMARY"
      - name: Locate trusted compatible research update
        id: research
        if: ${{ always() && steps.inference.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),p='lake/signals/research_run.txt';
            const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name:'event-research-state',per_page:100});
            for(const a of data.artifacts) {
              if(a.expired || a.workflow_run?.head_branch!=='main' || a.workflow_run?.head_repository_id!==context.payload.repository.id)continue;
              const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:a.workflow_run.id});
              if(run.path!=='.github/workflows/event_research.yml' || run.event==='pull_request' || run.conclusion!=='success')continue;
              if(!fs.existsSync(p) || fs.readFileSync(p,'utf8').trim()!==String(run.id))core.setOutput('run',String(run.id));
              break;
            }
      - uses: actions/download-artifact@v4
        id: research_download
        if: ${{ always() && steps.research.outputs.run != '' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.research.outputs.run }}
          name: event-research-state
          path: lake/event-research-input
      - name: Commit a complete verified research generation for the next issuance
        id: research_install
        if: ${{ always() && steps.research_download.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          RESEARCH_RUN: ${{ steps.research.outputs.run }}
        run: python scripts/refresh_event_state.py research --source lake/event-research-input --source-run "$RESEARCH_RUN" --report operation-health/research.json
      - name: Find a complete compatible historical candidate report
        id: historical
        if: ${{ always() && steps.inference.outcome == 'success' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name:'event-historical-report',per_page:100});
            for(const a of data.artifacts) {
              if(a.expired || a.workflow_run?.head_branch!=='main' || a.workflow_run?.head_repository_id!==context.payload.repository.id)continue;
              const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:a.workflow_run.id});
              if(!run.path.endsWith('/event_historical_study.yml') || run.event==='pull_request' || run.conclusion!=='success')continue;
              const fs=require('fs'),p='lake/signals/historical_run.txt';
              if(!fs.existsSync(p) || fs.readFileSync(p,'utf8').trim()!==String(run.id))core.setOutput('run',String(run.id));
              break;
            }
      - uses: actions/download-artifact@v4
        id: historical_download
        timeout-minutes: 2
        if: ${{ always() && steps.historical.outputs.run != '' }}
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.historical.outputs.run }}
          name: event-historical-report
          path: lake/historical-source
      - name: Import historical evidence without importing models or issued records
        id: historical_install
        timeout-minutes: 2
        if: ${{ always() && steps.historical.outputs.run != '' && steps.historical_download.outcome == 'success' }}
        continue-on-error: true
        env:
          HISTORICAL_RUN: ${{ steps.historical.outputs.run }}
        run: python scripts/refresh_event_state.py historical --source lake/historical-source --source-run "$HISTORICAL_RUN" --report operation-health/historical.json
      - name: Locate completed adaptive feedback seed
        id: range_seed
        if: ${{ always() && steps.inference.outcome == 'success' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name:'event-adaptive-report',per_page:100});
            const fs=require('fs'),marker='lake/signals/range_seed_run.txt';
            for(const a of data.artifacts) {
              if(a.expired || a.workflow_run?.head_branch!=='main' || a.workflow_run?.head_repository_id!==context.payload.repository.id)continue;
              const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:a.workflow_run.id});
              if(run.path!=='.github/workflows/event_historical_study.yml' || run.event==='pull_request' || run.conclusion!=='success')continue;
              if(!fs.existsSync(marker) || fs.readFileSync(marker,'utf8').trim()!==String(run.id))core.setOutput('run',String(run.id));
              break;
            }
      - uses: actions/download-artifact@v4
        id: range_download
        timeout-minutes: 2
        if: ${{ always() && steps.range_seed.outputs.run != '' }}
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.range_seed.outputs.run }}
          name: event-adaptive-report
          path: lake/range-seed-input
      - name: Install verified past-only range feedback
        id: range_install
        timeout-minutes: 2
        if: ${{ always() && steps.range_download.outcome == 'success' }}
        continue-on-error: true
        env:
          RANGE_SEED_RUN: ${{ steps.range_seed.outputs.run }}
        run: python scripts/refresh_event_state.py range --source lake/range-seed-input --source-run "$RANGE_SEED_RUN" --report operation-health/range.json
      - name: Read current Actions execution times for causal attribution
        id: operation_times
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:context.runId});
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
              {...context.repo,run_id:context.runId,attempt_number:Number(process.env.GITHUB_RUN_ATTEMPT),per_page:100});
            fs.mkdirSync('operation-health',{recursive:true});
            fs.writeFileSync('operation-health/actions.json',JSON.stringify({id:run.id,run_attempt:run.run_attempt,
              created_at:run.created_at,event:run.event,head_sha:run.head_sha,
              jobs:jobs.map(j=>({name:j.name,run_attempt:j.run_attempt,started_at:j.started_at,steps:j.steps}))}));
      - name: Attribute current gaps and optional refresh outcomes
        id: operation_audit
        if: always()
        continue-on-error: true
        env:
          REFRESH_BOOTSTRAP_RESEARCH: ${{ steps.bootstrap_research.outcome }}
          REFRESH_BOOTSTRAP_DOWNLOAD: ${{ steps.bootstrap_download.outcome }}
          REFRESH_BOOTSTRAP_INSTALL: ${{ steps.bootstrap_install.outcome }}
          REFRESH_RESEARCH: ${{ steps.research.outcome }}
          REFRESH_RESEARCH_DOWNLOAD: ${{ steps.research_download.outcome }}
          REFRESH_RESEARCH_INSTALL: ${{ steps.research_install.outcome }}
          REFRESH_HISTORICAL: ${{ steps.historical.outcome }}
          REFRESH_HISTORICAL_DOWNLOAD: ${{ steps.historical_download.outcome }}
          REFRESH_HISTORICAL_INSTALL: ${{ steps.historical_install.outcome }}
          REFRESH_RANGE_SEED: ${{ steps.range_seed.outcome }}
          REFRESH_RANGE_DOWNLOAD: ${{ steps.range_download.outcome }}
          REFRESH_RANGE_INSTALL: ${{ steps.range_install.outcome }}
        run: python scripts/build_operation_health.py
      - name: Record separate core delivery and optional health outcomes
        if: ${{ always() && (steps.inference.outcome == 'success' || steps.inference.outcome == 'failure') }}
        env:
          CORE_OUTCOME: ${{ steps.publication.outcome }}
          DENSE_OUTCOME: ${{ steps.dense_variance.outcome }}
          REVIEW_OUTCOME: ${{ steps.failure_review.outcome }}
          DENSE_PERSIST: ${{ steps.dense_persist.outcome }}
          AVAILABILITY_OUTCOME: ${{ steps.availability_shadow.outcome }}
        run: python scripts/recovery_health.py --publication "$CORE_OUTCOME" --dense "$DENSE_OUTCOME" --review "$REVIEW_OUTCOME" --dense-persist "$DENSE_PERSIST" --availability "$AVAILABILITY_OUTCOME"
      - name: Capture final issuance and delivery receipts even after a publication failure
        id: final_snapshot
        if: ${{ always() && (steps.inference.outcome == 'success' || steps.inference.outcome == 'failure') }}
        run: |
          python scripts/event_state.py snapshot lake/signals final-hourly-state
          python scripts/recovery_health.py --retain final-hourly-state
      - name: Retain availability shadow without blocking core evidence upload
        id: availability_snapshot
        if: ${{ always() && steps.final_snapshot.outcome == 'success' }}
        continue-on-error: true
        env:
          AVAILABILITY_OUTCOME: ${{ steps.availability_shadow.outcome }}
        run: python scripts/availability_shadow.py export --root lake/signals --target final-hourly-state --outcome "$AVAILABILITY_OUTCOME"
      - name: Build small current-run automation health receipt
        id: automation_health
        if: always()
        continue-on-error: true
        env:
          HEALTH_INPUT_REFRESH: ${{ steps.operation_audit.outputs.refresh_outcome }}
          HEALTH_OPERATION_AUDIT: ${{ steps.operation_audit.outcome }}
          HEALTH_INFERENCE: ${{ steps.inference.outcome }}
          HEALTH_PUBLICATION: ${{ steps.publication.outcome }}
          HEALTH_VARIANCE_DAILY: ${{ steps.variance_daily.outcome }}
          HEALTH_DENSE_VARIANCE: ${{ steps.dense_variance.outcome }}
          HEALTH_DENSE_PERSIST: ${{ steps.dense_persist.outcome }}
          HEALTH_FAILURE_REVIEW: ${{ steps.failure_review.outcome }}
          HEALTH_AVAILABILITY_SHADOW: ${{ steps.availability_shadow.outcome }}
          HEALTH_FINAL_SNAPSHOT: ${{ steps.final_snapshot.outcome }}
          HEALTH_AVAILABILITY_SNAPSHOT: ${{ steps.availability_snapshot.outcome }}
        run: python scripts/build_automation_health.py --root final-hourly-state --output automation-health/health.json
      - name: Upload compact automation health independently of full snapshot
        id: automation_health_upload
        if: ${{ always() && steps.automation_health.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: event-automation-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: automation-health/health.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.final_snapshot.outcome == 'success' }}
        with:
          name: event-final-state
          path: final-hourly-state/
          compression-level: 9
          retention-days: 7
          if-no-files-found: error
      - name: Fail optional health only after core delivery and evidence retention
        if: ${{ always() && (steps.variance_daily.outcome == 'failure' || steps.dense_variance.outcome == 'failure' || steps.dense_persist.outcome == 'failure' || steps.failure_review.outcome == 'failure' || steps.availability_shadow.outcome == 'failure' || steps.availability_snapshot.outcome == 'failure' || steps.automation_health.outcome == 'failure' || steps.automation_health_upload.outcome == 'failure' || steps.operation_audit.outcome == 'failure' || steps.operation_audit.outputs.refresh_outcome == 'failure') }}
        run: |
          echo "::error::Core delivery has its own recorded outcome. Optional refresh/variance/dense/review/availability health failed; inspect retained recovery diagnostics."
          exit 1

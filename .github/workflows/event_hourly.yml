name: Hourly ETH event forecast
on:
  workflow_run:
    workflows: ["ETH hourly event research"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-forecast
  cancel-in-progress: false
jobs:
  forecast:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-events.txt
      - run: python -m pip install -r requirements-events.txt
      - name: Locate trusted successful research and latest durable hourly ledger
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('backup',new Date().getUTCHours()===0 ? 'true':'false');
            for (const [name,key,workflow] of [['event-research-state','research','event_research.yml'],['event-hourly-state','hourly','event_hourly.yml']]) {
              const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name,per_page:100});
              for(const a of data.artifacts) {
                if(a.expired || a.workflow_run?.head_branch!=='main' || a.workflow_run?.head_repository_id!==context.payload.repository.id)continue;
                const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:a.workflow_run.id});
                if(!run.path.endsWith('/'+workflow) || run.event==='pull_request')continue;
                if(key==='research' && run.conclusion!=='success')continue;
                core.setOutput(key,a.workflow_run.id);break;
              }
            }
      - name: Require an existing replay before issuance
        run: test -n "${{ steps.state.outputs.research }}"
      - uses: actions/download-artifact@v4
        if: steps.state.outputs.hourly != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.state.outputs.hourly }}
          name: event-hourly-state
          path: lake/signals
      - name: Check whether a new research state is available
        id: refresh
        env:
          RESEARCH_RUN: ${{ steps.state.outputs.research }}
        run: |
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path('lake/signals/research_run.txt')
          changed=not p.exists() or p.read_text().strip()!=os.environ['RESEARCH_RUN']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'changed={str(changed).lower()}\n')
          PY
      - uses: actions/download-artifact@v4
        if: steps.refresh.outputs.changed == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.state.outputs.research }}
          name: event-research-state
          path: lake/event-research-input
      - name: Merge source vintages and checkpoints while preserving actual issued records
        if: steps.refresh.outputs.changed == 'true'
        env:
          RESEARCH_RUN: ${{ steps.state.outputs.research }}
        run: |
          python scripts/event_state.py merge lake/event-research-input lake/signals
          python - <<'PY'
          import os,pathlib
          pathlib.Path('lake/signals/research_run.txt').write_text(os.environ['RESEARCH_RUN'])
          PY
      - name: Collect closed bars, settle matured outcomes and infer from saved models
        id: inference
        run: |
          if git ls-remote --exit-code --heads origin data/event-ledger > /dev/null; then
            git fetch origin data/event-ledger:refs/remotes/origin/data/event-ledger
            git show origin/data/event-ledger:lake/event-ledger/issued.db > lake/signals/issued.db
          fi
          python scripts/run_event_forecast.py --collect --daily --review --horizons 6 24 72 168 336 720
      - name: Preserve the issuance audit before publication
        run: bash scripts/persist_event_ledger.sh
      - name: Consistent durable snapshot before any public release
        run: python scripts/event_state.py snapshot lake/signals hourly-state
      - uses: actions/upload-artifact@v4
        with:
          name: event-hourly-state
          path: hourly-state/
          compression-level: 9
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_run' || steps.state.outputs.backup == 'true' }}
        with:
          name: event-daily-backup
          path: hourly-state/
          compression-level: 9
          retention-days: 30
      - name: Publish event probabilities, price ranges and immutable results
        run: bash scripts/publish_events.sh

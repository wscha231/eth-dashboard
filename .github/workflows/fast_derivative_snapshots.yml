name: Fast ETH derivative snapshots
on:
  push:
    branches: [main]
    paths:
      - scripts/collect_fast_derivative_snapshots.py
      - scripts/persist_data_branch_overlay.py
      - scripts/restore_r3_research.py
      - scripts/data_branch_policy.py
      - tests/test_fast_derivative_snapshots.py
      - tests/test_persist_data_branch_overlay.py
      - .github/workflows/fast_derivative_snapshots.yml
  schedule:
    - cron: "23 3,7,11,15,19,23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fast-derivative-snapshots
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install -r requirements-runtime.txt pytest
      - name: Restore accumulated vendor caches
        run: |
          if git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast; then
            python scripts/daily_source_state.py restore origin/data/daily-forecast
          fi
      - name: Restore private fast derivative history
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rm -rf private-derivative-fast
          python scripts/restore_r3_research.py --stream derivative-fast-research --target private-derivative-fast
          mkdir -p lake/raw/vendor
          cp -a private-derivative-fast/lake/raw/vendor/. lake/raw/vendor/
      - name: Test fast snapshot collector and branch persistence
        run: python -m pytest tests/test_fast_derivative_snapshots.py tests/test_persist_data_branch_overlay.py -q
      - name: Collect receipt-timestamped derivative context
        run: python scripts/collect_fast_derivative_snapshots.py --output-dir lake/raw/vendor
      - name: Package fast derivative receipt
        run: |
          mkdir -p fast-derivative-state/lake/raw/vendor fast-derivative-state/lake/reports
          for f in bitget_eth_context_4h.csv hyperliquid_eth_context_4h.csv; do
            if [ -s "lake/raw/vendor/$f" ]; then cp "lake/raw/vendor/$f" fast-derivative-state/lake/raw/vendor/; fi
          done
          cp lake/reports/fast_derivative_snapshot.json fast-derivative-state/lake/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: fast-derivative-state
          path: fast-derivative-state/
          compression-level: 9
          retention-days: 30
          if-no-files-found: error

name: ETH HAR-RV variance shadow

on:
  push:
    branches: [main]
    paths:
      - signal_pipeline/variance_shadow.py
      - scripts/run_variance_shadow.py
      - scripts/persist_variance_ledger.sh
      - tests/test_variance_shadow.py
      - .github/workflows/variance_shadow.yml
  pull_request:
    branches: [main]
    paths:
      - signal_pipeline/variance_shadow.py
      - scripts/run_variance_shadow.py
      - scripts/persist_variance_ledger.sh
      - tests/test_variance_shadow.py
      - .github/workflows/variance_shadow.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

# Share the operational lock with event_hourly so both workflows never push the
# event-ledger audit branch concurrently.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-events.txt

      - run: python -m pip install -r requirements-events.txt pytest

      - name: Validate frozen variance-shadow contracts
        run: |
          python -m pytest tests/test_variance_shadow.py tests/test_r2_range_volatility_wave1.py tests/test_v2_contract.py -q
          git diff --check

      - name: Locate latest trusted main event state
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['event-final-state','event-hourly-state']) {
              const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name,per_page:100});
              for (const artifact of data.artifacts) {
                if (artifact.expired || artifact.workflow_run?.head_branch!=='main' || artifact.workflow_run?.head_repository_id!==context.payload.repository.id) continue;
                const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:artifact.workflow_run.id});
                if (run.path!=='.github/workflows/event_hourly.yml' || run.event==='pull_request' || run.conclusion!=='success') continue;
                core.setOutput('run',String(run.id));
                core.setOutput('name',name);
                core.setOutput('artifact_id',String(artifact.id));
                return;
              }
            }
            core.setFailed('No trusted successful main event state is available');

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
          name: ${{ steps.source.outputs.name }}
          path: lake/signals

      - name: Restore prior variance-only ledger and checkpoints
        run: |
          if git ls-remote --exit-code --heads origin data/event-ledger > /dev/null; then
            git fetch origin data/event-ledger:refs/remotes/origin/data/event-ledger
            if git cat-file -e origin/data/event-ledger:lake/event-ledger/variance-shadow/issued.db 2>/dev/null; then
              restore="$RUNNER_TEMP/variance-restore"
              mkdir -p "$restore"
              git archive origin/data/event-ledger -- lake/event-ledger/variance-shadow | tar -x -C "$restore"
              mkdir -p lake/signals/variance_shadow
              cp -a "$restore/lake/event-ledger/variance-shadow/." lake/signals/variance_shadow/
            fi
          fi

      - name: Fit or restore HAR-RV checkpoints, settle truth, issue eligible origin
        run: |
          python scripts/run_variance_shadow.py --root lake/signals
          test -s lake/signals/variance_shadow/active.json
          test -s lake/signals/variance_shadow/issued.db
          test -s lake/signals/variance_shadow/report.json
          cat lake/signals/variance_shadow/report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve immutable variance audit branch
        if: github.event_name != 'pull_request'
        run: bash scripts/persist_variance_ledger.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: variance-shadow-state
          path: lake/signals/variance_shadow/
          compression-level: 9
          retention-days: 90
          if-no-files-found: error

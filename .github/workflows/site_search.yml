name: Publish search and sharing assets
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/site_search.yml
      - scripts/publish_search_assets.py
      - forecast_site/public/index.html
      - forecast_site/public/robots.txt
      - forecast_site/public/sitemap.xml
      - forecast_site/public/site-info.css
      - forecast_site/public/ko/**
      - forecast_site/public/social-preview.*
      - forecast_site/vercel.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-forecast
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish assets with the existing forecast release
        run: |
          git config user.name eth-forecast-bot
          git config user.email eth-forecast-bot@users.noreply.github.com
          git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast
          git worktree add --detach "$RUNNER_TEMP/search-site" origin/data/daily-forecast
          python scripts/publish_search_assets.py --target "$RUNNER_TEMP/search-site" --stage
          if ! git -C "$RUNNER_TEMP/search-site" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/search-site" commit -m "chore(site): publish search metadata and dated outlook"
            git -C "$RUNNER_TEMP/search-site" push origin HEAD:refs/heads/data/daily-forecast
          fi

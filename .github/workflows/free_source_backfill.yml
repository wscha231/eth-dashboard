name: Free ETH research source backfill
on:
  push:
    branches: [main]
    paths:
      - data_lab/free_source_fallbacks.py
      - data_lab/market_research_sources.py
      - scripts/collect_free_source_fallbacks.py
      - scripts/persist_data_branch_overlay.py
      - tests/test_free_source_fallbacks.py
      - tests/test_market_research_sources.py
      - tests/test_incremental_reconciliation.py
      - tests/test_persist_data_branch_overlay.py
      - config/data_source_registry.json
      - .github/workflows/free_source_backfill.yml
  schedule:
    - cron: "10 1 * * *"
    - cron: "10 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: free-source-backfill
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install -r requirements-runtime.txt pytest
      - name: Restore accumulated vendor caches
        run: |
          if git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast; then
            python scripts/daily_source_state.py restore origin/data/daily-forecast
          fi
      - name: Test incremental source refresh and branch persistence
        run: python -m pytest tests/test_free_source_fallbacks.py tests/test_market_research_sources.py tests/test_incremental_reconciliation.py tests/test_persist_data_branch_overlay.py -q
      - name: Collect incremental free research sources
        run: python scripts/collect_free_source_fallbacks.py --output-dir lake/raw/vendor --start-date 2017-01-01
      - name: Persist research caches with retryable overlay
        run: |
          python scripts/persist_data_branch_overlay.py \
            --message "chore(data): refresh free fallback research sources" \
            --file lake/raw/vendor/bitget_eth_free_features.csv \
            --file lake/raw/vendor/deribit_eth_dvol_daily.csv \
            --file lake/raw/vendor/hyperliquid_eth_free_features.csv \
            --file lake/raw/vendor/fred_current_vintage_long.csv \
            --file lake/raw/vendor/fred_initial_release_long.csv \
            --file lake/raw/vendor/fred_initial_asof_daily.csv \
            --file lake/reports/free_source_fallbacks.json
      - name: Package collection receipt
        run: |
          mkdir -p free-source-state/lake/raw/vendor free-source-state/lake/reports
          for f in bitget_eth_free_features.csv deribit_eth_dvol_daily.csv hyperliquid_eth_free_features.csv fred_current_vintage_long.csv fred_initial_release_long.csv fred_initial_asof_daily.csv; do
            if [ -s "lake/raw/vendor/$f" ]; then cp "lake/raw/vendor/$f" free-source-state/lake/raw/vendor/; fi
          done
          cp lake/reports/free_source_fallbacks.json free-source-state/lake/reports/
      - name: Package isolated derivative-history research state
        run: |
          set -euo pipefail
          mkdir -p derivative-history-state/lake/raw/vendor derivative-history-state/lake/reports
          copied=0
          for f in bitget_eth_free_features.csv deribit_eth_dvol_daily.csv hyperliquid_eth_free_features.csv; do
            if [ -s "lake/raw/vendor/$f" ]; then
              cp "lake/raw/vendor/$f" derivative-history-state/lake/raw/vendor/
              copied=$((copied + 1))
            fi
          done
          if [ "$copied" -eq 0 ]; then
            echo "No derivative-history research files were produced" >&2
            exit 1
          fi
          DERIVATIVE_ARCHIVE_FILE_COUNT="$copied" python - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          root=Path('derivative-history-state')
          files=sorted(p.relative_to(root).as_posix() for p in root.glob('lake/raw/vendor/*.csv'))
          manifest={
              'schema':1,
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'status':'research_only_private_archive_bridge',
              'file_count':int(os.environ['DERIVATIVE_ARCHIVE_FILE_COUNT']),
              'files':files,
              'public_redistribution':'blocked',
              'model_use':'blocked_pending_rights_storage_pit_audit_and_preregistered_gate',
              'site_use':'blocked',
              'paid_product_use':'blocked',
              'note':'Stage A private archive bridge; legacy public data-branch persistence is removed only after Drive recovery proof.',
          }
          path=root/'lake/reports/derivative_history_private_archive.json'
          path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(manifest,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: free-source-fallback-state
          path: free-source-state/
          compression-level: 9
          retention-days: 30
          if-no-files-found: error
      - name: Upload isolated derivative-history research state
        uses: actions/upload-artifact@v4
        with:
          name: derivative-history-research-state
          path: derivative-history-state/
          compression-level: 9
          retention-days: 30
          if-no-files-found: error

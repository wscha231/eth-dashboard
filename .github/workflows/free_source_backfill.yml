name: Free ETH research source backfill
on:
  push:
    branches: [main]
    paths:
      - data_lab/free_source_fallbacks.py
      - data_lab/market_research_sources.py
      - scripts/collect_free_source_fallbacks.py
      - tests/test_free_source_fallbacks.py
      - tests/test_market_research_sources.py
      - config/data_source_registry.json
      - .github/workflows/free_source_backfill.yml
  schedule:
    - cron: "10 1 * * *"
    - cron: "10 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-daily-forecast-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install -r requirements-runtime.txt pytest
      - name: Restore accumulated vendor caches
        run: |
          if git fetch origin data/daily-forecast:refs/remotes/origin/data/daily-forecast; then
            python scripts/daily_source_state.py restore origin/data/daily-forecast
          fi
      - name: Test free-source parsers
        run: python -m pytest tests/test_free_source_fallbacks.py tests/test_market_research_sources.py -q
      - name: Collect free fallback sources
        run: python scripts/collect_free_source_fallbacks.py --output-dir lake/raw/vendor --start-date 2017-01-01
      - name: Persist research caches
        run: |
          git config user.name "eth-forecast-bot"
          git config user.email "eth-forecast-bot@users.noreply.github.com"
          git worktree add --detach "$RUNNER_TEMP/daily-data" origin/data/daily-forecast
          mkdir -p "$RUNNER_TEMP/daily-data/lake/raw/vendor" "$RUNNER_TEMP/daily-data/lake/reports"
          for f in \
            bitget_eth_free_features.csv \
            deribit_eth_dvol_daily.csv \
            hyperliquid_eth_free_features.csv \
            fred_current_vintage_long.csv \
            fred_initial_release_long.csv \
            fred_initial_asof_daily.csv; do
            if [ -s "lake/raw/vendor/$f" ]; then cp "lake/raw/vendor/$f" "$RUNNER_TEMP/daily-data/lake/raw/vendor/$f"; fi
          done
          cp lake/reports/free_source_fallbacks.json "$RUNNER_TEMP/daily-data/lake/reports/free_source_fallbacks.json"
          git -C "$RUNNER_TEMP/daily-data" add -f lake/raw/vendor lake/reports/free_source_fallbacks.json
          if ! git -C "$RUNNER_TEMP/daily-data" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/daily-data" commit -m "chore(data): refresh free fallback research sources"
            git -C "$RUNNER_TEMP/daily-data" push origin HEAD:refs/heads/data/daily-forecast
          fi
      - name: Package collection receipt
        run: |
          mkdir -p free-source-state/lake/raw/vendor free-source-state/lake/reports
          for f in bitget_eth_free_features.csv deribit_eth_dvol_daily.csv hyperliquid_eth_free_features.csv fred_current_vintage_long.csv fred_initial_release_long.csv fred_initial_asof_daily.csv; do
            if [ -s "lake/raw/vendor/$f" ]; then cp "lake/raw/vendor/$f" free-source-state/lake/raw/vendor/; fi
          done
          cp lake/reports/free_source_fallbacks.json free-source-state/lake/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: free-source-fallback-state
          path: free-source-state/
          compression-level: 9
          retention-days: 7
          if-no-files-found: error

name: Intraday breakout nowcast

on:
  pull_request:
    paths:
      - "forecasting/intraday_nowcast.py"
      - "scripts/evaluate_intraday_nowcast.py"
      - "tests/test_intraday_nowcast.py"
      - "tests/test_evaluate_intraday_nowcast.py"
      - ".github/workflows/intraday_breakout_nowcast.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Bounded smoke or authoritative historical evaluation"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: intraday-breakout-nowcast-${{ github.ref }}-${{ inputs.profile || 'initial-full' }}
  cancel-in-progress: true

# The first review run is intentionally the single predeclared full gate. Once
# its evidence is frozen, pull requests switch to smoke and full remains manual.
env:
  EVAL_PROFILE: ${{ github.event_name == 'pull_request' && 'full' || inputs.profile }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install numpy pandas pytest

      - name: Unit and leakage-contract tests
        run: >-
          python -m pytest -q
          tests/test_intraday_nowcast.py
          tests/test_evaluate_intraday_nowcast.py
          tests/test_lead_signal_data.py

      - name: Run hourly nowcast evaluation
        id: nowcast
        continue-on-error: true
        run: |
          python scripts/evaluate_intraday_nowcast.py \
            --profile "$EVAL_PROFILE" \
            --raw-dir "${RUNNER_TEMP}/intraday-nowcast-raw" \
            --workers 8 \
            --output "${RUNNER_TEMP}/intraday-nowcast.json" \
            --markdown-output "${RUNNER_TEMP}/intraday-nowcast.md"

      - name: Verify offline infrastructure gate
        run: |
          test -s "${RUNNER_TEMP}/intraday-nowcast.json"
          jq -e '.gate.infrastructure_status == "PASS"' \
            "${RUNNER_TEMP}/intraday-nowcast.json"

      - name: Upload offline review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-breakout-nowcast-${{ github.run_id }}-${{ env.EVAL_PROFILE }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/intraday-nowcast.json
            ${{ runner.temp }}/intraday-nowcast.md

name: ETH supply research
on:
  pull_request:
    branches: [main]
    paths:
      - data_lab/eth_supply.py
      - scripts/collect_eth_supply.py
      - tests/test_eth_supply.py
      - research/r3_eth_supply_v1_20260917/**
      - .github/workflows/eth_supply_research.yml
      - scripts/gdrive_store.py
      - scripts/archive_to_drive.py
      - scripts/archive_r3_research_to_drive.py
      - .github/workflows/r3_research_drive_archive.yml
  push:
    branches: [main]
    paths:
      - data_lab/eth_supply.py
      - scripts/collect_eth_supply.py
      - tests/test_eth_supply.py
      - research/r3_eth_supply_v1_20260917/**
      - .github/workflows/eth_supply_research.yml
      - scripts/gdrive_store.py
      - scripts/archive_to_drive.py
      - scripts/archive_r3_research_to_drive.py
      - .github/workflows/r3_research_drive_archive.yml
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: eth-supply-research-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install -r requirements-runtime.txt pytest
      - name: Test supply parsing, accounting and PIT rules
        run: python -m pytest tests/test_eth_supply.py -q
      - name: Find previous successful ETH supply research state
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {data}=await github.rest.actions.listArtifactsForRepo({...context.repo,name:'eth-supply-research-state',per_page:100});
            const allowed=['main',context.payload.pull_request?.head?.ref].filter(Boolean);
            if(context.eventName==='push') {
              const {data:prs}=await github.rest.repos.listPullRequestsAssociatedWithCommit({...context.repo,commit_sha:context.sha});
              for(const pr of prs) if(pr.merged_at && pr.merge_commit_sha===context.sha && pr.head.repo?.full_name===`${context.repo.owner}/${context.repo.repo}`) allowed.push(pr.head.ref);
            }
            const artifact=data.artifacts.find(a=>!a.expired && a.workflow_run?.head_repository_id===context.payload.repository.id && allowed.includes(a.workflow_run?.head_branch));
            if(artifact) core.setOutput('run',artifact.workflow_run.id);
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run }}
          name: eth-supply-research-state
          path: lake/research/eth_supply
      - name: Collect detailed, tracked and live ETH supply receipts
        run: python scripts/collect_eth_supply.py --root lake/research/eth_supply
      - name: Verify rights, PIT, coverage and independent accounting gates
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('lake/research/eth_supply/report.json')
          d=json.loads(p.read_text())
          assert d['status']=='research_only_rights_unreviewed'
          assert d['public_redistribution']=='blocked_pending_rights_review'
          assert d['model_use'].startswith('blocked_')
          assert d['site_use']=='blocked'
          assert d['source_range']=='30d'
          assert d['history_rows'] >= 20
          assert int(d['tracked_to_slot']) >= int(d['tracked_from_slot'])
          assert str(d['tracked_identity_error_wei']) == '0'
          assert str(d['live_identity_error_wei']) in {'0',''}
          assert len(d['history_sha256']) == 64
          assert len(d['tracked_sha256']) == 64
          assert len(d['live_sha256']) == 64
          print(json.dumps({k:d[k] for k in ('history_rows','first_timestamp','last_timestamp','source_range','source_interval','new_rows','revised_rows','tracked_from_slot','tracked_to_slot','tracked_identity_error_wei','live_identity_error_wei','live_total_supply_eth')},sort_keys=True))
          PY
      - name: Upload immutable ETH supply research state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-supply-research-state
          path: lake/research/eth_supply/
          compression-level: 9
          retention-days: 30
          if-no-files-found: error
      - name: Summarize supply gate
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('lake/research/eth_supply/report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## R3 P0-2 ETH supply research\n\n')
              if not p.exists():
                  f.write('No valid source report was produced. MODEL/site promotion is forbidden.\n')
              else:
                  d=json.loads(p.read_text())
                  for key in ('status','history_rows','first_timestamp','last_timestamp','source_range','source_interval','new_rows','revised_rows','tracked_identity_error_wei','live_identity_error_wei','license_status'):
                      f.write(f'- {key}: `{d.get(key)}`\n')
                  f.write('\nFirst rolling history remains receipt-time reconstructed; MODEL/site use stays blocked.\n')
          PY

name: Lead-signal feature contract

on:
  pull_request:
    paths:
      - "forecasting/lead_signal_data.py"
      - "forecasting/lead_signals.py"
      - "forecasting/tail_events.py"
      - "scripts/backfill_lead_signals.py"
      - "scripts/build_lead_signal_features.py"
      - "tests/test_lead_signal_data.py"
      - "tests/test_lead_signals.py"
      - "tests/test_tail_events.py"
      - "tests/test_build_lead_signal_features.py"
      - "lake/manifests/lead_signal_sources.json"
      - "lake/gold/lead_signal_sources/**"
      - ".github/workflows/lead_signal_feature_contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-signal-feature-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install numpy pandas pytest

      - name: Unit and leakage tests
        run: >-
          python -m pytest -q
          tests/test_lead_signal_data.py
          tests/test_lead_signals.py
          tests/test_tail_events.py
          tests/test_build_lead_signal_features.py

      - name: Build full immutable daily feature artifact
        run: >-
          python scripts/build_lead_signal_features.py
          --raw-dir "${RUNNER_TEMP}/lead_signal_full"
          --workers 8
          --timeout-seconds 30
          --replace-outputs

      - name: Verify generated artifact contract
        run: >-
          python -m pytest -q
          tests/test_build_lead_signal_features.py::test_generated_feature_artifact_matches_immutable_manifest

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: lead-signal-feature-contract-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            lake/gold/lead_signal_daily.csv.gz
            lake/manifests/lead_signal_features.json
            lake/reports/lead_signal_feature_readiness.json
